>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#17694F\">&#8235;نقيس الانتماء والثقة لا المخالفات فقط&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#142B27\">&#8235;نقل القيم&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;الهوية واللغة والتاريخ بين الأجيال&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#17694F\">&#8235;إعادة إنتاج قيم مشروعة لا تفاوت&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#142B27\">&#8235;الضبط&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;قواعد وجداول وتقويم يحمي التعلم&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#17694F\">&#8235;شرعيته بالوضوح والتناسب والاعتراض&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#142B27\">&#8235;الحراك&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;الجهد والقدرة إلى شهادة وموقع&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#17694F\">&#8235;لا يكفي إتاحة المقاعد بلا إنصاف&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#142B27\">&#8235;التمايز المهني&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;مهارات وأدوار متخصصة&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#17694F\">&#8235;مسارات مرنة وإرشاد غير متحيز&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:10px;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#142B27\">&#8235;وظائف أخرى:&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#ECE5D6;border-radius:40px;padding:6px 18px\">&#8235;الرعاية والحماية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#ECE5D6;border-radius:40px;padding:6px 18px\">&#8235;إنتاج المعرفة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#ECE5D6;border-radius:40px;padding:6px 18px\">&#8235;رأس المال الاجتماعي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#ECE5D6;border-radius:40px;padding:6px 18px\">&#8235;تكوين المواطنة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#ECE5D6;border-radius:40px;padding:6px 18px\">&#8235;التجديد الثقافي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#ECE5D6;border-radius:40px;padding:6px 18px\">&#8235;إدارة التغير&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#0F3A31;border-radius:12px;padding:20px 26px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;برنامج تنمية القدرات البشرية (رؤية 2030)&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;تعلّم مدى الحياة، ومواءمة مع سوق العمل، وقيم وطنية واعتزاز بالعربية.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#0F3A31;border-radius:12px;padding:20px 26px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;البكر (2017): «مدرستي صندوق مغلق»&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;فتح علاقة المدرسة بالمجتمع وفحص ثقافتها الداخلية.&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(البكر، 2017، أبواب المدرسة والمجتمع والثقافة المدرسية؛ OECD, 2024؛ Saudi Vision 2030, 2021)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">14<\/p>", "notes": "التنشئة الاجتماعية: تُكسب المدرسة المتعلم لغة المجتمع ورموزه وقواعد التفاعل وأخلاق العمل العام. وهي تنشئة ثانوية توسع أفق الطفل من علاقات القرابة إلى علاقات تقوم على أدوار ومعايير مشتركة، وتتحقق عبر المنهج الرسمي والخفي معاً. والمؤشر القيادي لا يقتصر على عدد المخالفات؛ بل يشمل الانتماء والثقة وعدالة الإجراءات.\n\nنقل القيم وإعادة إنتاجها: نقل الهوية واللغة والتاريخ شرط للاستمرارية، لكن \"إعادة الإنتاج\" تحتمل معنيين: قيم مشروعة تحفظ الجماعة، أو تفاوت وسلطة غير عادلة. وتنسجم هذه المساءلة مع الطرح الذي يرى المدرسة السعودية أحياناً \"صندوقاً مغلقاً\" يحتاج إلى فتح علاقته بالمجتمع وإعادة فحص ثقافته الداخلية (البكر، 2017).\n\nالضبط الاجتماعي: ضروري لحماية التعلم والحقوق، ويكتسب شرعيته من الوضوح والاتساق والتناسب وإمكان الاعتراض. فإذا تركز العقاب في فئة محددة، فيجب فحص القاعدة نفسها وطريقة تطبيقها.\n\nالحراك الاجتماعي: لا يتحقق بمجرد إتاحة المقاعد؛ بل يحتاج عدالة في الجودة والدعم والوصول الرقمي والإرشاد. وتعرّف OECD الإنصاف بأنه حصول كل طالب على الموارد والدعم اللازمين لتحقيق إمكاناته بصرف النظر عن ظروفه (OECD, 2024).\n\nالتمايز المهني: حاضر في برنامج تنمية القدرات البشرية الذي يربط التعلم مدى الحياة بمواءمة المخرجات مع سوق العمل، مع غرس القيم الوطنية والاعتزاز بالعربية. غير أن فلسفة التعليم لا تختزل الإنسان في \"مدخل لسوق العمل\"؛ فيلزم مسارات مرنة، وإرشاد مبكر غير متحيز، وربط المهارات التقنية بالتفكير الأخلاقي والمدني.\n\nووظائف أخرى: الرعاية والحماية، وإنتاج المعرفة، وبناء رأس المال الاجتماعي، وتكوين المواطنة، والتجديد الثقافي، وإدارة التغير. وهي لا تنسجم تلقائياً؛ ومهمة القيادة إدارة المفاضلات بينها علناً وفق سلّم غايات واضح.\n\nأمانة علمية: صفحات كتاب البكر تُطابق مع النسخة الورقية.", "ntitle": "المدرسة وظيفياً", "dark": false}, {"id": "foundations", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:20px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;الأسس والتطبيقات (ناتج التعلم 1.3)&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الأصل يفسر «لماذا»، والتطبيق يحدد «كيف»&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(52px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;من الأصل الوظيفي إلى التطبيق التربوي ومحك نقده&#8236;<\/h2>\n<table style=\"font-size:calc(24px * var(--fs));color:#2F3D39;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6\">\n<tr style=\"background:#0F3A31\">\n<th style=\"width:30%;color:#D7C0EC;text-align:right\">&#8235;محك النقد&#8236;<\/th>\n<th style=\"width:28%;color:#F2ECDF;text-align:right\">&#8235;التطبيق التربوي&#8236;<\/th>\n<th style=\"width:26%;color:#F2ECDF;text-align:right\">&#8235;دلالته الاجتماعية&#8236;<\/th>\n<th style=\"width:16%;color:#B98B3E;text-align:right\">&#8235;الأصل الوظيفي&#8236;<\/th>\n<\/tr>\n<tr><td>&#8235;هل يُسمع صوت الطالب أم القرار مركزي؟&#8236;<\/td><td>&#8235;مجالس شراكة، تخطيط متكامل&#8236;<\/td><td>&#8235;تتأثر بالأسرة والاقتصاد والدولة&#8236;<\/td><td>&#8235;<b>نسق مترابط<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;متفق عليها حقاً أم قيم فئة أقوى؟&#8236;<\/td><td>&#8235;منهج وطني، قواعد سلوك&#8236;<\/td><td>&#8235;الاستقرار يحتاج قيماً مشتركة&#8236;<\/td><td>&#8235;<b>الإجماع القيمي<\/b>&#8236;<\/td><\/tr>\n<tr><td>&#8235;هل المسارات مرنة وعادلة؟&#8236;<\/td><td>&#8235;مسارات أكاديمية ومهنية، توجيه&#8236;<\/td><td>&#8235;المجتمع يحتاج تخصص الأدوار&#8236;<\/td><td>&#8235;<b>التمايز<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;هل فرص الاستعداد متكافئة؟&#8236;<\/td><td>&#8235;تقويم موحد، منافسة، منح&#8236;<\/td><td>&#8235;المكانة تُكتسب بالإنجاز&#8236;<\/td><td>&#8235;<b>الجدارة<\/b>&#8236;<\/td><\/tr>\n<tr><td>&#8235;بيروقراطية أو غموض مسؤولية؟&#8236;<\/td><td>&#8235;فرق مهنية، قيادة موزعة&#8236;<\/td><td>&#8235;جودة الجزء تؤثر في الكل&#8236;<\/td><td>&#8235;<b>الاعتماد المتبادل<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;يعالج السبب أم يحفظ المظهر؟&#8236;<\/td><td>&#8235;خطط تحسين، دعم تعثر&#8236;<\/td><td>&#8235;يعالج التوتر بالتكيف&#8236;<\/td><td>&#8235;<b>التوازن<\/b>&#8236;<\/td><\/tr>\n<tr><td>&#8235;هل تُجمع بيانات نوعية عن الخبرة؟&#8236;<\/td><td>&#8235;تقويم المنهج الخفي والمناخ&#8236;<\/td><td>&#8235;للممارسة نتائج غير معلنة&#8236;<\/td><td>&#8235;<b>الوظائف الكامنة<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;من يحدد الضرر وعلى أي مستوى؟&#8236;<\/td><td>&#8235;تحليل فجوات وعقوبات وتسرب&#8236;<\/td><td>&#8235;بعض النتائج تضر فئة&#8236;<\/td><td>&#8235;<b>الاختلال<\/b>&#8236;<\/td><\/tr>\n<\/table>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(جعنيني، 2010؛ شيحة، 2006؛ Merton, 1968)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">15<\/p>", "notes": "من مقتضيات ناتج التعلم 1.3 ألا تختلط الفكرة الاجتماعية بالممارسة التربوية. فالأصل يفسر لماذا تُبنى الممارسة، بينما التطبيق يحدد كيف تُنفذ وتُقوّم. والتشبيه المقرّب: الأصل أساس المبنى، والتطبيق غرفه وأثاثه.\n\nنقرأ الجدول من اليمين:\n- المجتمع نسق مترابط؛ فالمدرسة تتأثر بالأسرة والاقتصاد والدولة؛ وتطبيقه مجالس شراكة وتخطيط متكامل وإحالات بين الخدمات؛ ومحكه: هل يُسمع صوت الطالب والمجتمع أم يظل القرار مركزياً؟\n- الإجماع القيمي: الاستقرار يحتاج قيماً مشتركة؛ تطبيقه منهج وطني وقواعد سلوك وأنشطة مواطنة؛ ومحكه: هل القيم متفق عليها حقاً أم تمثل فئة أقوى؟\n- التمايز الوظيفي: المجتمع الحديث يحتاج تخصص الأدوار؛ تطبيقه مسارات وتوجيه وشهادات؛ ومحكه مرونة المسارات وعدالتها.\n- الجدارة: المكانة تُكتسب بالإنجاز؛ تطبيقه تقويم موحد ومنافسة ومنح؛ ومحكه تكافؤ فرص الاستعداد.\n- الاعتماد المتبادل: جودة الجزء تؤثر في الكل؛ تطبيقه فرق مهنية وتعلم تعاوني وقيادة موزعة؛ ومحكه ألا يتحول التكامل إلى بيروقراطية أو غموض مسؤولية.\n- التوازن: النسق يعالج التوتر بالتكيف؛ تطبيقه خطط تحسين ودعم تعثر وإدارة أزمات؛ ومحكه: هل نعالج السبب أم نحافظ على المظهر؟\n- الوظائف الكامنة: للممارسة نتائج غير معلنة؛ تطبيقه تقويم المنهج الخفي والمناخ المدرسي؛ ومحكه جمع بيانات نوعية عن الخبرة الفعلية.\n- الاختلال: بعض النتائج تضر النسق أو فئة منه؛ تطبيقه تحليل الفجوات والعقوبات والتسرب؛ ومحكه: من يحدد الضرر، وعلى أي مستوى؟", "ntitle": "الأسس والتطبيقات", "dark": false}, {"id": "policy", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;المناهج · التقويم · تكافؤ الفرص · سوق العمل&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;السياسات التعليمية&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;من الفرز إلى الإنصاف: السياسات بعين وظيفية&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;١&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(36px * var(--fs));font-weight:700;color:#142B27\">&#8235;المنهج&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;حدٌّ مشترك من المعرفة واللغة والقيم، مع تهيئة للتخصص.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;<b>أربعة اختبارات:<\/b> تمثيل التنوع · اتساق القيم مع الممارسة · مساحة للسؤال · مرونة الاستجابة.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;٢&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(36px * var(--fs));font-weight:700;color:#142B27\">&#8235;التقويم والاختيار&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;افصل ثلاث وظائف: تحسين التعلم · منح الشهادة · توزيع الفرص.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;خلطها في أداة واحدة عالية المخاطر يجعل الخطأ القياسي حاسماً في المصير.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;٣&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(36px * var(--fs));font-weight:700;color:#142B27\">&#8235;تكافؤ الفرص&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;من مساواة شكلية تعطي الجميع الشيء نفسه، إلى إنصاف يوفر دعماً بقدر الحاجة.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;انشر مؤشرات موزعة لا متوسطات فقط.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;٤&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(36px * var(--fs));font-weight:700;color:#142B27\">&#8235;سوق العمل&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;مواءمة ديناميكية لا خضوع آني: أساس معرفي واسع وتعلم مستمر.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;لا يحتكر صاحب العمل تعريف الإنسان المتعلم.&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"flex:1\"><\/div>\n<div style=\"background:#0F3A31;border-radius:16px;padding:36px 48px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(44px * var(--fs));font-weight:700;line-height:1.4;color:#F2ECDF\">&#8235;لا يكون معيار الجدارة عادلاً <span style=\"color:#B98B3E\">إلا إذا سبقته شروط عادلة للتعلم.<\/span>&#8236;<\/p>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(UNESCO, 2020؛ OECD, 2024؛ World Bank, 2018)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">16<\/p>", "notes": "ننتقل من الوظيفة إلى القرار. أربعة مجالات سياساتية:\n\nأولاً، المنهج: وظيفياً ينبغي أن يضمن الحد المشترك من المعرفة واللغة والقيم، وأن يهيئ للتخصص والتكامل الاجتماعي. لكن المنهج ليس قائمة معلومات؛ إنه اختيار اجتماعي لما يُعد معرفة مشروعة. ولذلك تقتضي القراءة النقدية أربعة اختبارات: تمثيل التنوع، واتساق القيم المعلنة مع الممارسة، ووجود مساحة للسؤال، ومرونة الاستجابة للتحولات. وتشير سياسة الشمول لدى اليونسكو إلى ضرورة أن يكون المنهج مرناً وذا صلة وقابلاً للوصول لجميع المتعلمين (UNESCO, 2020).\n\nثانياً، التقويم والاختيار: نوصي بفصل ثلاث وظائف للتقويم: تحسين التعلم، ومنح الشهادة، وتوزيع الفرص. فخلطها في أداة واحدة عالية المخاطر يجعل الخطأ القياسي أو التفاوت السابق حاسماً في مستقبل الطالب. والبديل: تعدد الأدلة، وإتاحة فرص الاستدراك، وتقويم النمو إلى جانب المستوى، ومراجعة الأثر التفاضلي للاختبارات.\n\nثالثاً، تكافؤ الفرص: الوظيفية البارسونزية تفترض انتقال المكانة من النسب إلى الإنجاز، لكن بيانات منظمة التعاون الاقتصادي والتنمية تكشف استمرار فجوات مرتبطة بالخلفية الاجتماعية، بما ينقض افتراض أن المعايير الموحدة وحدها تكفل التكافؤ (OECD, 2024). لذلك ننتقل من المساواة الشكلية إلى الإنصاف، وننشر مؤشرات العدالة موزعة بحسب الفئات: الوصول، والحضور، والتحصيل، والنمو، والانتقال، والعقوبات — مع حماية الخصوصية ومنع الوصم.\n\nرابعاً، سوق العمل: يبرر المنظور الوظيفي المواءمة، وتؤكد الأدلة الدولية أن القوى العاملة الماهرة تدعم الإنتاجية والتكيف والابتكار، وأن المهارات المطلوبة تجمع المعرفي والاجتماعي الوجداني والتقني (World Bank, 2018). لكن المواءمة ينبغي أن تكون ديناميكية لا خضوعاً آنياً لطلب السوق؛ والغاية فوق الوظيفة: عمل كريم، ومواطنة مسؤولة، وشخصية متوازنة.\n\nوالخلاصة في الشريط الداكن: لا يكون معيار الجدارة عادلاً إلا إذا سبقته شروط عادلة للتعلم.\n\nسؤال متوقع: \"أليس الإنصاف تمييزاً بين الطلاب؟\"\nالجواب: الإنصاف لا يعني خفض المعيار، بل توزيع الدعم بحسب الحاجة حتى يصل الجميع إلى المعيار نفسه؛ وهو ما تعده OECD متكاملاً مع الكفاءة لا متعارضاً معها.\n\nجسر: \"ومن ينفذ هذه السياسات على الأرض؟ القائد المدرسي والمشرف التربوي.\"", "ntitle": "السياسات التعليمية", "dark": false}, {"id": "leadership", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;قائد المدرسة · المشرف التربوي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;القيادة التربوية&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;القائد منسِّقٌ للنسق لا منفِّذٌ للوائح&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:40px\">\n<div style=\"flex:1.1;display:flex;flex-direction:column;gap:14px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:600;color:#142B27\">&#8235;وظائف قائد المدرسة&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:16px 24px\">\n<p style=\"width:56px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#17694F\">&#8235;١&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(26px * var(--fs))\">&#8235;توضيح الغايات وربط التعلم بالهوية والعدل&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:16px 24px\">\n<p style=\"width:56px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#17694F\">&#8235;٢&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(26px * var(--fs))\">&#8235;تحديد التوقعات وتوزيع المسؤوليات بوضوح مساءلة&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:16px 24px\">\n<p style=\"width:56px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#17694F\">&#8235;٣&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(26px * var(--fs))\">&#8235;ربط الوحدات بقنوات معلومات أفقية ورأسية&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:16px 24px\">\n<p style=\"width:56px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#17694F\">&#8235;٤&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(26px * var(--fs))\">&#8235;إدارة الحدود مع الأسرة والإدارة والمجتمع&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:16px 24px\">\n<p style=\"width:56px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#17694F\">&#8235;٥&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(26px * var(--fs))\">&#8235;تشخيص الاختلال قبل تحوله إلى أزمة&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:600;color:#142B27\">&#8235;المشرف التربوي: ثلاثة أدوار&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px\">\n<p style=\"flex:1;font-size:calc(28px * var(--fs));font-weight:700;color:#142B27;background:#E1EFE7;border-radius:12px;padding:18px 20px\">&#8235;التكامل&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(28px * var(--fs));font-weight:700;color:#142B27;background:#E1EFE7;border-radius:12px;padding:18px 20px\">&#8235;التطوير&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(28px * var(--fs));font-weight:700;color:#142B27;background:#E1EFE7;border-radius:12px;padding:18px 20px\">&#8235;الوساطة&#8236;<\/p>\n<\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;وصلٌ بين السياسة والفصل: يفسر المعايير، ويبني قدرة المعلم، وينقل صوت الميدان إلى صانع القرار.&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px;background:#0F3A31;border-radius:12px;padding:24px 28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;شاهد من مجلة جامعة الجوف&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;ارتبطت القيادة الخادمة إيجابياً بالالتزام التنظيمي للعاملين: التوازن يُبنى بخدمة الأفراد لا بالأوامر وحدها.&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(آل مسلط، 2019)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">17<\/p>", "notes": "في المنظور الوظيفي، قائد المدرسة ليس منفذاً إدارياً فحسب، بل منسق للأدوار والقيم والموارد والتغذية الراجعة. وتتمثل وظائفه في خمس: توضيح الغايات، وتحديد التوقعات، وربط الوحدات، وإدارة الحدود بين المدرسة والأسرة والإدارة والمجتمع، وتشخيص الاختلال قبل أن يتحول إلى أزمة.\n\nوتترجم هذه الوظائف إلى ممارسات: بناء رؤية مشتركة تربط التعلم بالهوية والعدل وخدمة المجتمع؛ وتوزيع المسؤوليات وفق الكفاءة مع وضوح المساءلة؛ وإنشاء قنوات معلومات أفقية ورأسية لا الاكتفاء بالتقارير الصاعدة؛ وحماية الوقت التعليمي مع توفير الرعاية؛ ورصد الوظائف الكامنة للقرارات والطقوس المدرسية؛ وفتح المدرسة للأسر والمجتمع دون التفريط باستقلال الحكم التربوي؛ ومراجعة دورية للاختلالات والفئات التي تتحمل تكلفتها.\n\nوأذكّر هنا بما قلناه عن التوازن: نجاح القائد لا يقاس بانخفاض المشكلات أو انتظام الجداول فقط، بل بقدرته على تنسيق التدريس والإرشاد والنشاط والشراكة الأسرية حول تعلم ذي معنى.\n\nأما المشرف التربوي فيقوم بوظيفة وصل بين السياسة والفصل، ويوازن بين ثلاثة أدوار: التكامل بتوحيد الحد الأدنى من المعايير، والتطوير بتقديم الدعم المهني، والوساطة بترجمة حاجات السياقات المختلفة إلى تعديلات في السياسة. وبهذا يمنع انفصال المستوى المركزي عن الخبرة الصفية.\n\nوالشاهد من جامعتنا: نتائج منشورة في مجلة جامعة الجوف للعلوم التربوية تفيد بأن القيادة الخادمة ارتبطت إيجابياً بالالتزام التنظيمي لدى العاملين، مع توصية بتهيئة بيئة محفزة (آل مسلط، 2019). وهذا يدعم الجمع بين التكامل المؤسسي وخدمة الأفراد.\n\nسؤال متوقع: \"أليس هذا قيادة تبادلية أو بيروقراطية بثوب جديد؟\"\nالجواب: لا؛ لأن القائد الوظيفي النقدي يجعل الاعتراض والتغذية الراجعة مصادر معلومات للنسق، لا تهديداً للاستقرار.\n\nجسر: \"ولكي تكتمل الصورة القيادية، نقدم نموذجاً مقترحاً يجمع التكامل والعدل والتعلم.\"", "ntitle": "القيادة التربوية", "dark": false}, {"id": "model", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:32px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;نموذج قيادي مقترح&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;القيادة التربوية&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;دورة «تكامل – عدل – تعلّم»&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(48px * var(--fs));font-weight:700;line-height:1;color:#17694F\">&#8235;١&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;تحديد الغاية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;ما القيمة والوظيفة؟ ولمن؟&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(48px * var(--fs));font-weight:700;line-height:1;color:#17694F\">&#8235;٢&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;رسم النسق&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;الأطراف والأدوار والموارد والعلاقات&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(48px * var(--fs));font-weight:700;line-height:1;color:#17694F\">&#8235;٣&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;تمييز النتائج&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;الظاهر والكامن والاختلال&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #6E3F94;border-radius:12px;padding:20px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(48px * var(--fs));font-weight:700;line-height:1;color:#6E3F94\">&#8235;٤&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;فحص العدالة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;توزيع المنافع والأعباء والفرص&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #6E3F94;border-radius:12px;padding:20px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(48px * var(--fs));font-weight:700;line-height:1;color:#6E3F94\">&#8235;٥&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;المشاورة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;المعلمون والطلاب والأسر&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #B98B3E;border-radius:12px;padding:20px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(48px * var(--fs));font-weight:700;line-height:1;color:#8C6420\">&#8235;٦&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;تنفيذ مرن&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;مسؤوليات ومؤشرات وتكيف محلي&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #B98B3E;border-radius:12px;padding:20px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(48px * var(--fs));font-weight:700;line-height:1;color:#8C6420\">&#8235;٧&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;تعلم مؤسسي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;بيانات وقصص واعتراضات ↺ إلى ١&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"flex:1\"><\/div>\n<div style=\"background:#0F3A31;border-radius:16px;padding:32px 44px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;line-height:1.45;color:#F2ECDF\">&#8235;التوازن لا يتحقق بالضبط وحده؛ <span style=\"color:#B98B3E\">فالتوازن المستدام ينتج من شرعية القرار وعدالته وقدرة المؤسسة على التعلم.<\/span>&#8236;<\/p>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(نموذج مقترح من الباحثتين، مبني على: Merton, 1968؛ OECD, 2024؛ علي وفرج، 2009)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">18<\/p>", "notes": "يقترح العرض دورة \"تكامل – عدل – تعلّم\" من سبع محطات:\n١. تحديد الغاية: ما القيمة والوظيفة المراد تحقيقها، ولمن؟\n٢. رسم النسق: ما الأطراف والأدوار والموارد والعلاقات المؤثرة؟\n٣. تمييز النتائج: ما الوظائف الظاهرة والكامنة والاختلالات المحتملة؟ — وهنا أدوات ميرتون.\n٤. فحص العدالة: كيف تتوزع المنافع والأعباء والفرص؟\n٥. المشاورة: إشراك المعلمين والطلاب والأسر وأصحاب الصلة.\n٦. التنفيذ المرن: تحديد مسؤوليات ومؤشرات مع السماح بالتكيف المحلي.\n٧. التعلم المؤسسي: مراجعة البيانات والقصص والاعتراضات، ثم تعديل السياسة، والعودة إلى الغاية.\n\nهذه الدورة تصحح افتراض أن التوازن يتحقق بالضبط وحده؛ فالتوازن المستدام ينتج من شرعية القرار، وعدالته، وقدرة المؤسسة على التعلم.\n\nسؤال متوقع: \"ما الجديد مقارنة بدورات التحسين المعروفة؟\"\nالجواب: تضيف خطوتين لا توجدان في الدورات المعتادة: تمييز النتائج الكامنة، وفحص العدالة في التوزيع، وتجعل المشاورة خطوة إلزامية.\n\nملاحظة أمانة: النموذج مقترح من الباحثتين، وسيُطبّق على حالة الغياب في نهاية العرض.", "ntitle": "نموذج قيادي مقترح", "dark": false}, {"id": "critique", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;أوجه القوة · المآخذ الأساسية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;القراءة النقدية&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;عدسة قوية… بحدود واضحة&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:32px\">\n<div style=\"width:600px;display:flex;flex-direction:column;gap:12px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#17694F\">&#8235;أوجه القوة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:#E1EFE7;border-radius:10px;padding:14px 18px;color:#142B27\">&#8235;١ · رؤية كلية تمنع تجزئة المدرسة إلى حصص وإجراءات منفصلة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:#E1EFE7;border-radius:10px;padding:14px 18px;color:#142B27\">&#8235;٢ · تبرز ضرورة التنشئة والانتماء والقواعد المشتركة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:#E1EFE7;border-radius:10px;padding:14px 18px;color:#142B27\">&#8235;٣ · تفسر صلة التعليم بتقسيم العمل والتخصص والمهارات&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:#E1EFE7;border-radius:10px;padding:14px 18px;color:#142B27\">&#8235;٤ · مع ميرتون تصبح أداة تقويم لا تبرير فقط&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#6E3F94\">&#8235;المآخذ الأساسية&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;تضخيم الإجماع&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;قد يكون امتثالاً صامتاً&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;تكريس الوضع الراهن&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;الاستمرار ليس دليل الضرورة&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;إهمال الصراع&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;تغيب القوة والثروة والمكانة&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;افتراض الجدارة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;رأس مال غير متساوٍ عند المدخل&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;ضعف تفسير التغير الجذري&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;قد تُوصم المعارضة بالاختلال&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:4px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;النزعة الغائية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;«لأن المجتمع يحتاج» بدل الدليل&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Merton, 1968؛ السهلاوي، 1993، مج 5، ع 1؛ Bourdieu &amp; Passeron, 1977)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">19<\/p>", "notes": "أوجه القوة: أولاً، تقدم الوظيفية رؤية كلية تمنع تجزئة المدرسة إلى حصص وإجراءات منفصلة، وتفسر كيف يتراكم أثر القيم والتنظيم والتقويم والعلاقات ليصنع نمطاً اجتماعياً. ثانياً، تبرز ضرورة التنشئة والانتماء والقواعد المشتركة. ثالثاً، تفسر صلة التعليم بتقسيم العمل والتخصص والمهارات. رابعاً، يتيح ميرتون فحص النتائج غير المقصودة والاختلال والبدائل، فيحوّل النظرية إلى أداة تقويم لا تبرير فقط. كما تساعد القيادة على التفكير في الاعتماد المتبادل وإدارة الحدود بين المؤسسات.\n\nالمآخذ الأساسية:\n- تضخيم الإجماع: قد تفترض قيماً مشتركة أكثر مما هو قائم، وتقلل من أثر السلطة في تعريف \"المصلحة العامة\"؛ فيلزم التمييز بين إجماع حر متجدد وامتثال صامت.\n- تكريس الوضع الراهن: إذا فُسرت كل مؤسسة بوظيفتها في البقاء، صار استمرارها دليلاً على ضرورتها. والمدرسة الجيدة لا تحفظ المجتمع كما هو فحسب؛ بل تساعده على تصحيح نفسه.\n- إهمال الصراع: تركز على التكامل أكثر من توزيع القوة والثروة والمكانة؛ وقد عرض السهلاوي الفرق: الوظيفية ترى المدرسة جزءاً يحفظ الاستقرار، ونظرية الصراع ترى أنها قد تسهم في فرض الهيمنة وإعادة إنتاج التفاوت (السهلاوي، 1993).\n- افتراض الجدارة: الطلاب لا يدخلون المدرسة برأس مال اقتصادي وثقافي متساوٍ (Bourdieu & Passeron, 1977).\n- ضعف تفسير التغير الجذري: تجيد تفسير الاستمرار والتكيف التدريجي، وقد تصف المعارضة بالاختلال مع أنها أحياناً إنذار أخلاقي يفتح طريق الإصلاح.\n- النزعة الغائية: تفسير وجود المؤسسة بنتيجتها النافعة دون إثبات آلية سببية؛ فلا تُستخدم عبارة \"لأن المجتمع يحتاج\" بديلاً عن البحث التاريخي والتجريبي.", "ntitle": "القراءة النقدية", "dark": false}, {"id": "conflict", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;الصراع وإعادة الإنتاج&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;القراءة النقدية&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;سباقٌ لا يبدأ فيه الجميع من خط واحد&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:32px\">\n<div style=\"width:640px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;flex-direction:column;gap:6px;background:#0F3A31;border-radius:12px;padding:22px 26px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#F2ECDF\">&#8235;بورديو وباسرون (1977)&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#D8CFBD\">&#8235;المدرسة تكافئ رأس المال الثقافي للفئات المهيمنة، ثم تختم الفروق السابقة بختم «الجدارة».&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:#0F3A31;border-radius:12px;padding:22px 26px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#F2ECDF\">&#8235;بولز وجنتس (1976)&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#D8CFBD\">&#8235;مبدأ التطابق: تنظيم المدرسة يحاكي علاقات العمل الهرمية ويعدّ لها.&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:#0F3A31;border-radius:12px;padding:22px 26px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#F2ECDF\">&#8235;السهلاوي (1993)&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#D8CFBD\">&#8235;وظيفياً تحفظ المدرسة الاستقرار؛ وصراعياً قد تفرض الهيمنة وتعيد إنتاج التفاوت.&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;flex-direction:column;gap:6px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:12px;padding:18px 22px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#142B27\">&#8235;وهم الجدارة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;الإنجاز المقيس قد يقيس رأس مال الأسرة لا جهد الطالب&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:12px;padding:18px 22px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#142B27\">&#8235;تضخيم الإجماع&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;ما يبدو إجماعاً قد يكون امتثالاً صامتاً&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:12px;padding:18px 22px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#142B27\">&#8235;تكريس الوضع الراهن&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;استمرار المؤسسة يُتخذ دليلاً على ضرورتها&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:#F1E8D2;border-radius:12px;padding:18px 22px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#8C6420\">&#8235;التشبيه ومثاله&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;سباق يبدأ بعضه من خط متقدم ثم نصفّق للفائز كأنه الأسرع. طالب بدروس خصوصية ومنصات مدفوعة يتفوق في «القدرات»: جدارة فردية أم رأس مال أسري؟&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Bourdieu &amp; Passeron, 1977؛ Bowles &amp; Gintis, 1976؛ السهلاوي، 1993، مج 5، ع 1؛ OECD, 2024)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">20<\/p>", "notes": "رأينا الوظيفية في صورتها البنائية المتماسكة. والآن سؤال مزعج: ماذا لو كان \"الإنجاز\" نفسه منسوباً متنكراً؟\n\nتخيلن سباق 400 متر يبدأ فيه بعض المتسابقين من خط متقدم بمئة متر، ثم نصفّق للفائز كأنه الأسرع. هذا جوهر نقد بورديو وباسرون: الطلاب لا يدخلون المدرسة برأس مال اقتصادي وثقافي متساوٍ، والمدرسة قد تكافئ ثقافة الفئات المهيمنة — لغتها وذائقتها وطرائق تفكيرها — ثم تمنح الفروق السابقة \"ختم\" الجدارة، فتبدو اللامساواة موهبة فردية (Bourdieu & Passeron, 1977).\n\nومثالنا: طالب تتوفر له دروس خصوصية ومنصات تدريب مدفوعة وأسرة متعلمة تتابعه، يتفوق في اختبار القدرات. هل نتيجته جدارة فردية خالصة، أم جزء منها رأس مال أسري؟ لا نقول إنه لا يستحق، بل نقول إن المعيار الموحد لا يكفي وحده لضمان تكافؤ الفرص، وهو ما تؤكده بيانات الإنصاف الدولية (OECD, 2024).\n\nويضيف بولز وجنتس مبدأ التطابق: تنظيم المدرسة — الهرمية والانضباط والحوافز الخارجية — يحاكي علاقات العمل ويعدّ الطلاب لمواقعهم فيها (Bowles & Gintis, 1976). وعربياً عرض السهلاوي الفرق بوضوح: الوظيفية ترى المدرسة جزءاً يحفظ الاستقرار، والصراع يراها قد تفرض الهيمنة وتعيد إنتاج التفاوت (السهلاوي، 1993).\n\nومن هنا ثلاثة مآخذ:\nوهم الجدارة: الإنجاز المقيس قد يقيس رأس مال الأسرة لا جهد الطالب وحده.\nتضخيم الإجماع: ما يبدو إجماعاً قد يكون امتثالاً صامتاً أو استبعاداً لأصوات ضعيفة.\nتكريس الوضع الراهن: إذا فُسّرت كل مؤسسة بوظيفتها في البقاء، صار استمرارها دليلاً على ضرورتها، ووُصمت المعارضة بالاختلال.\n\nأمانة علمية: لم نحدد صفحات لبورديو وبولز وجنتس لأننا استندنا إلى الأطروحة العامة لا إلى اقتباس حرفي.\n\nسؤال متوقع: \"ألا تقع نظرية الصراع في حتمية مقابلة؟\"\nالجواب: بلى، ولذلك نستعملها عدسة كاشفة لا بديلاً كاملاً، كما توضح المصفوفة التالية.", "ntitle": "الصراع وإعادة الإنتاج", "dark": false}, {"id": "matrix", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;مقارنة النظريات (١ من ٢)&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;مقارنة النظريات&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(60px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;ثلاث عدسات على مدرسة واحدة&#8236;<\/h2>\n<table style=\"font-size:calc(24px * var(--fs));color:#2F3D39;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6\">\n<tr style=\"background:#0F3A31\">\n<th style=\"width:22%;color:#B98B3E;text-align:right\">&#8235;الدلالة القيادية&#8236;<\/th>\n<th style=\"width:21%;color:#D3C6EA;text-align:right\">&#8235;النظرية النقدية&#8236;<\/th>\n<th style=\"width:21%;color:#D7C0EC;text-align:right\">&#8235;الصراع/إعادة الإنتاج&#8236;<\/th>\n<th style=\"width:21%;color:#A6DCC3;text-align:right\">&#8235;الوظيفية&#8236;<\/th>\n<th style=\"width:15%;color:#F2ECDF;text-align:right\">&#8235;البعد&#8236;<\/th>\n<\/tr>\n<tr>\n<td>&#8235;اجمع بين التنسيق وتحليل القوة&#8236;<\/td>\n<td>&#8235;بنية قابلة للنقد والتحرر بالحوار والفعل&#8236;<\/td>\n<td>&#8235;مجال تفاوت وصراع مصالح&#8236;<\/td>\n<td>&#8235;نسق مترابط يميل للتوازن&#8236;<\/td>\n<td>&#8235;<b>صورة المجتمع<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;لا تقِس النظام فقط؛ قِس الصوت والعدل&#8236;<\/td>\n<td>&#8235;بناء الوعي والفاعلية والتحول&#8236;<\/td>\n<td>&#8235;إعادة إنتاج طبقي وثقافي وشرعنة التفاوت&#8236;<\/td>\n<td>&#8235;تنشئة، تضامن، فرز، تأهيل&#8236;<\/td>\n<td>&#8235;<b>وظيفة المدرسة<\/b>&#8236;<\/td>\n<\/tr>\n<tr>\n<td>&#8235;صياغة تشاركية منضبطة أخلاقياً&#8236;<\/td>\n<td>&#8235;قيم تُفحص نقدياً وحوارياً&#8236;<\/td>\n<td>&#8235;قيم الفئة المهيمنة&#8236;<\/td>\n<td>&#8235;إجماع نسبي&#8236;<\/td>\n<td>&#8235;<b>القيم<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;أدلة متعددة ومراجعة الأثر التفاضلي&#8236;<\/td>\n<td>&#8235;تقويم للنمو والقدرة على النقد&#8236;<\/td>\n<td>&#8235;تحويل الامتياز السابق إلى «جدارة»&#8236;<\/td>\n<td>&#8235;تخصيص الأدوار وفق الإنجاز&#8236;<\/td>\n<td>&#8235;<b>التقويم<\/b>&#8236;<\/td>\n<\/tr>\n<\/table>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Parsons, 1959؛ Bourdieu &amp; Passeron, 1977؛ Bowles &amp; Gintis, 1976؛ Freire, 1970/2000؛ السهلاوي، 1993)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">21<\/p>", "notes": "نقرأ المصفوفة أفقياً، بُعداً بُعداً، والعمود الأخير دلالته القيادية.\n\nصورة المجتمع: نسق مترابط يميل للتوازن عند الوظيفية، ومجال تفاوت وصراع مصالح عند نظريات الصراع وإعادة الإنتاج، وبنية قابلة للنقد والتحرر بالحوار والفعل عند النظرية النقدية. والدلالة القيادية: اجمع بين التنسيق وتحليل القوة.\n\nوظيفة المدرسة: تنشئة وتضامن وفرز وتأهيل، مقابل إعادة إنتاج طبقي وثقافي وشرعنة للتفاوت، مقابل بناء الوعي والفاعلية والتحول. والدلالة: لا تقِس النظام فقط؛ قِس الصوت والعدل.\n\nالقيم: إجماع نسبي، مقابل قيم الفئة المهيمنة، مقابل قيم تُفحص نقدياً وحوارياً. والدلالة: اجعل صياغة القيم تشاركية ومنضبطة أخلاقياً.\n\nالتقويم: تخصيص الأدوار وفق الإنجاز، مقابل تحويل الامتياز السابق إلى \"جدارة\"، مقابل تقويم للنمو والقدرة على النقد. والدلالة: استخدم أدلة متعددة وراجع الأثر التفاضلي.", "ntitle": "مقارنة النظريات (١)", "dark": false}, {"id": "matrix-2", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;مقارنة النظريات (٢ من ٢)&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;مقارنة النظريات&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(60px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;لا اختيار مطلقاً: ثلاثة أسئلة معاً&#8236;<\/h2>\n<table style=\"font-size:calc(24px * var(--fs));color:#2F3D39;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6\">\n<tr style=\"background:#0F3A31\">\n<th style=\"width:22%;color:#B98B3E;text-align:right\">&#8235;الدلالة القيادية&#8236;<\/th>\n<th style=\"width:21%;color:#D3C6EA;text-align:right\">&#8235;النظرية النقدية&#8236;<\/th>\n<th style=\"width:21%;color:#D7C0EC;text-align:right\">&#8235;الصراع/إعادة الإنتاج&#8236;<\/th>\n<th style=\"width:21%;color:#A6DCC3;text-align:right\">&#8235;الوظيفية&#8236;<\/th>\n<th style=\"width:15%;color:#F2ECDF;text-align:right\">&#8235;البعد&#8236;<\/th>\n<\/tr>\n<tr>\n<td>&#8235;حافظ على الاستقرار اللازم ولا تغلق الإصلاح&#8236;<\/td>\n<td>&#8235;تحرري تشاركي&#8236;<\/td>\n<td>&#8235;ناتج الصراع وإعادة توزيع القوة&#8236;<\/td>\n<td>&#8235;تدريجي تكيفي&#8236;<\/td>\n<td>&#8235;<b>التغيير<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;منظور مركب لا أحادي&#8236;<\/td>\n<td>&#8235;ربط المعرفة بالفعل والتحرر&#8236;<\/td>\n<td>&#8235;كشف المصالح واللامساواة&#8236;<\/td>\n<td>&#8235;تفسير التكامل والاستمرار&#8236;<\/td>\n<td>&#8235;<b>نقطة القوة<\/b>&#8236;<\/td>\n<\/tr>\n<tr>\n<td>&#8235;بيانات + حوار + معيار أخلاقي&#8236;<\/td>\n<td>&#8235;خطاب معياري يصعب تشغيله&#8236;<\/td>\n<td>&#8235;الاختزال الاقتصادي والحتمية&#8236;<\/td>\n<td>&#8235;المحافظة والغائية&#8236;<\/td>\n<td>&#8235;<b>الخطر<\/b>&#8236;<\/td>\n<\/tr>\n<\/table>\n<div style=\"flex:1\"><\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#E1EFE7;border-radius:12px;padding:20px 24px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#17694F\">&#8235;الوظيفية تسأل&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;color:#142B27\">&#8235;كيف يعتمد الجزء على الكل؟&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#EEE6F3;border-radius:12px;padding:20px 24px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#6E3F94\">&#8235;الصراع يسأل&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;color:#142B27\">&#8235;من يملك تعريف الكل وتوزيع منافعه؟&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:#E6E3EE;border-radius:12px;padding:20px 24px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#4B3F7A\">&#8235;النقدية تسأل&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;color:#142B27\">&#8235;كيف يشارك المتعلمون في تحويله؟&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Parsons, 1959؛ Bourdieu &amp; Passeron, 1977؛ Freire, 1970/2000, Ch. 2)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">22<\/p>", "notes": "التغيير: تدريجي تكيفي عند الوظيفية، وناتج من الصراع وإعادة توزيع القوة عند نظريات الصراع، وتحرري تشاركي عند النقدية. والدلالة القيادية: حافظ على الاستقرار اللازم ولا تغلق الإصلاح.\n\nنقطة القوة: تفسير التكامل والاستمرار، مقابل كشف المصالح واللامساواة، مقابل ربط المعرفة بالفعل والتحرر. والدلالة: منظور مركب لا أحادي.\n\nالخطر: المحافظة والغائية، مقابل الاختزال الاقتصادي والحتمية، مقابل خطاب معياري يصعب تشغيله. والدلالة: بيانات + حوار + معيار أخلاقي.\n\nولا يلزم الاختيار المطلق بين النظريات. فالوظيفية تجيب: كيف يعتمد الجزء على الكل؟ ونظرية الصراع تسأل: من يملك تعريف الكل وتوزيع منافعه؟ والنقدية تسأل: كيف يشارك المتعلمون في تحويله؟ ويصبح التحليل أعمق حين تُطرح الأسئلة الثلاثة معاً.\n\nجسر: \"ولنختبر العدستين الأوليين على قرار حقيقي في تعليمنا: نظام المسارات.\"", "ntitle": "مقارنة النظريات (٢)", "dark": false}, {"id": "act-tracks", "style": "background:#0F3A31;color:#F2ECDF;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:700;color:#0F3A31;background:#B98B3E;padding:8px 24px;border-radius:40px\">&#8235;نشاط تفاعلي ٣ من ٤&#8236;<\/p>\n<svg class=\"draw\" viewBox=\"0 0 24 24\" style=\"color:#B98B3E;width:40px;height:40px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\" aria-hidden=\"true\"><circle pathLength=\"1\" cx=\"12\" cy=\"12\" r=\"10\"/><polyline pathLength=\"1\" points=\"12 6 12 12 16 14\" style=\"--o:.7s;--dur:.7s\"/><\/svg>\n<p style=\"font-size:calc(24px * var(--fs));color:#D8CFBD\">&#8235;٧ دقائق&#8236;<\/p>\n<\/div>\n<p style=\"font-size:calc(24px * var(--fs));color:#B7CBC3\">&#8235;مقارنة النظريات&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#F2ECDF\">&#8235;التفكير النقدي المعاكس: نظام المسارات الثانوية&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px 34px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;سؤال المناظرة&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(38px * var(--fs));line-height:1.45;color:#F2ECDF\">&#8235;هل يحقق نظام المسارات تكافؤ الفرص والجدارة الوظيفية، أم يعيد إنتاج التمايز الاجتماعي كما يرى بورديو؟&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#E1EFE7;border-radius:16px;padding:24px 28px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#17694F\">&#8235;فريق «بارسونز»&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;المسارات تطابق الميول والقدرات مع حاجات سوق العمل، وتمنح كل طالب طريقاً للتميز.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:10px;background:#EEE6F3;border-radius:16px;padding:24px 28px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#6E3F94\">&#8235;فريق «بورديو»&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;الاختيار المبكر يتأثر بتوقعات الأسرة ورأس مالها ومعرفتها بسوق العمل، فيثبّت المواقع القائمة.&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"font-size:calc(26px * var(--fs));color:#D8CFBD\">&#8235;تصويت أول ← دقيقتان لكل فريق ← تصويت ثانٍ: هل تغيّرت آراؤكن؟&#8236;<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#B7CBC3\">&#8235;(Parsons, 1959؛ Bourdieu &amp; Passeron, 1977؛ OECD, 2024) · النشاط من إعداد الباحثتين&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#B7CBC3;text-align:left\">23<\/p>", "notes": "طريقة الإدارة:\n١. (دقيقة) قراءة سؤال المناظرة، ثم تصويت أول برفع الأيدي وتسجيل النتيجة.\n٢. (30 ثانية) تقسيم القاعة إلى فريقين بحسب الجلوس لا بحسب الرأي، حتى تدافع بعض الطالبات عن رأي لا يتبنينه — وهذا جوهر \"التفكير المعاكس\".\n٣. (4 دقائق) دقيقتان لكل فريق: متحدثة أو اثنتان تعرضان أقوى حجة.\n٤. (30 ثانية) تصويت ثانٍ لرصد تحول الآراء.\n٥. (دقيقة) التعقيب الأكاديمي.\n\nحجج مساعدة لفريق بارسونز: المسارات تخصيص للأدوار يتسق مع تقسيم العمل الحديث، وتربط التعليم بحاجات التنمية، وتتيح للطالب التميز فيما يناسب ميوله (Parsons, 1959).\nحجج مساعدة لفريق بورديو: الاختيار المبكر يتأثر بتوقعات الأسرة ورأس مالها الثقافي ومعرفتها بالمهن؛ وقد يرسم المجتمع توقعات نمطية؛ وإن اختلف توفر المسارات بين المدارس والمناطق فقد يتحدد المسار بالموقع لا بالقدرة (Bourdieu & Passeron, 1977).\n\nالتعقيب الأكاديمي:\nالفريقان على حق جزئياً؛ فالسؤال الصحيح ليس هل المسارات عادلة، بل بأي شروط تصبح عادلة. وهنا أربعة شروط قيادية: توقيت اختيار لا يحسم المستقبل مبكراً، وإرشاد مهني غير متحيز يصل لكل الأسر، وإمكانية الانتقال بين المسارات، ونشر بيانات الالتحاق موزعة بحسب الفئات والمناطق لرصد أي تمايز (OECD, 2024).\n\nملاحظة: النشاط تمرين تحليلي لا حكم تجريبي على نظام المسارات؛ فالحكم يحتاج دراسات ميدانية — وهي إحدى التوصيات.", "ntitle": "نشاط تفاعلي ٣", "dark": true}, {"id": "islamic", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;نقاط الالتقاء · نقاط الافتراق&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;المنظور الإسلامي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(60px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;من «حفظ النسق» إلى «العدل والاستخلاف والكرامة»&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:20px\">\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:16px;align-items:center;background:#E1EFE7;border-radius:12px;padding:18px 24px\">\n<svg class=\"draw\" viewBox=\"0 0 24 24\" style=\"color:#17694F;width:48px;height:48px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z\" style=\"--dur:1.8s\"/><circle pathLength=\"1\" cx=\"12\" cy=\"12\" r=\"3\" style=\"--o:.9s\"/><\/svg>\n<p style=\"flex:1;font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;<b>الوظيفية = منظّم حرارة:<\/b> يعيد النسق إلى حالته القائمة، أياً كانت.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:16px;align-items:center;background:#F1E8D2;border-radius:12px;padding:18px 24px\">\n<svg class=\"draw\" viewBox=\"0 0 24 24\" style=\"color:#8C6420;width:48px;height:48px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\" aria-hidden=\"true\"><circle pathLength=\"1\" cx=\"12\" cy=\"12\" r=\"10\"/><path pathLength=\"1\" d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\" style=\"--o:.4s\"/><path pathLength=\"1\" d=\"M2 12h20\" style=\"--o:.7s\"/><\/svg>\n<p style=\"flex:1;font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;<b>المعيار الإسلامي = بوصلة:<\/b> يحدد الاتجاه الصحيح ولو اقتضى التغيير.&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:28px\">\n<div style=\"width:520px;display:flex;flex-direction:column;gap:10px;background:#0F3A31;border-radius:16px;padding:24px 28px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#A6DCC3\">&#8235;نقاط الالتقاء&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;• الإنسان كائن اجتماعي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;• التربية تبني الأخلاق والمسؤولية والانتماء&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;• التعاون وتقسيم العمل والتكافل&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;• رفض الفردانية المنعزلة، وللمؤسسة التربوية رسالة عامة&#8236;<\/p>\n<\/div>\n<table style=\"flex:1;font-size:calc(24px * var(--fs));color:#2F3D39;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6\">\n<tr style=\"background:#0F3A31\">\n<th style=\"width:40%;color:#B98B3E;text-align:right\">&#8235;المنظور الإسلامي&#8236;<\/th>\n<th style=\"width:38%;color:#F2ECDF;text-align:right\">&#8235;الوظيفية الوضعية&#8236;<\/th>\n<th style=\"width:22%;color:#F2ECDF;text-align:right\">&#8235;الافتراق&#8236;<\/th>\n<\/tr>\n<tr><td>&#8235;التوحيد والعبودية والاستخلاف&#8236;<\/td><td>&#8235;حاجات النسق كما تكشفها الملاحظة&#8236;<\/td><td>&#8235;<b>مصدر الغاية<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;صاحب كرامة ومسؤولية&#8236;<\/td><td>&#8235;حامل دور وظيفي&#8236;<\/td><td>&#8235;<b>الفرد<\/b>&#8236;<\/td><\/tr>\n<tr><td>&#8235;الإصلاح والأمر بالمعروف يجيزان النقد&#8236;<\/td><td>&#8235;الامتثال التنظيمي&#8236;<\/td><td>&#8235;<b>الطاعة<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;وحدة المقصد وتنوع القدرات والأدوار&#8236;<\/td><td>&#8235;التجانس شرط التضامن&#8236;<\/td><td>&#8235;<b>الاختلاف<\/b>&#8236;<\/td><\/tr>\n<\/table>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(علي وفرج، 2009؛ الجمال، 2016)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">24<\/p>", "notes": "التشبيه: الوظيفية تعمل كمنظّم الحرارة؛ وظيفته أن يعيد الغرفة إلى الدرجة المضبوطة عليها، أياً كانت. أما المعيار الإسلامي فيعمل كالبوصلة؛ يحدد الاتجاه الصحيح ولو اقتضى تغيير الحالة القائمة.\n\nنقاط الالتقاء: يلتقي المنظور الإسلامي مع الوظيفية في الاعتراف بأن الإنسان كائن اجتماعي، وأن التربية تبني الأخلاق والمسؤولية والانتماء، وأن المجتمع يحتاج التعاون وتقسيم العمل والتكافل. كما يلتقيان في رفض الفردانية المنعزلة، وفي النظر إلى المؤسسة التربوية بوصفها ذات رسالة عامة. وتؤكد فلسفة التربية الإسلامية النمو المتوازن للشخصية الروحية والعقلية والجسمية والاجتماعية، وربط المعرفة بالعمل الصالح، وتقدم المنظور الإسلامي معياراً كلياً لتقويم النظرية والممارسة (علي وفرج، 2009).\n\nنقاط الافتراق أربع:\nالأول: الوظيفية الوضعية تستمد الغايات من حاجات النسق كما تكشفها الملاحظة، بينما يستمد المنظور الإسلامي الغاية العليا من التوحيد والعبودية والاستخلاف، ويجعل الخبرة والعقل والاجتماع مصادر للفهم لا مصادر مستقلة عن الوحي للقيمة النهائية. لذلك لا يكون \"ما يحفظ النظام\" خيراً بالضرورة؛ فالعدل معيار سابق على مصلحة البنية القائمة.\nالثاني: الفرد في الإسلام صاحب كرامة ومسؤولية، لا مجرد حامل دور وظيفي.\nالثالث: الإصلاح والأمر بالمعروف يجيزان نقد الأعراف والمؤسسات، فلا تُساوى الطاعة الأخلاقية بالامتثال التنظيمي.\nالرابع: التكافل لا يبرر إذابة الاختلاف؛ بل يجمع وحدة المقصد وتنوع القدرات والأدوار.\n\nأمانة علمية: يختلف توصيف المقرر في سنة كتاب علي وفرج (2008) ورسم الاسم («فرح»).", "ntitle": "المنظور الإسلامي", "dark": false}, {"id": "criteria", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;معايير التقويم · تركيب مقترح&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;المنظور الإسلامي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(60px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;نحو «وظيفية نقدية قيمية»&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:28px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#0F3A31;border-radius:16px;padding:24px 30px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;سبعة معايير لتقويم أي سياسة أو ممارسة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#D8CFBD\">&#8235;<b><span style=\"color:#F2ECDF\">التوحيد والغاية:<\/span><\/b> هل تربط المعرفة بالمسؤولية والمعنى؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#D8CFBD\">&#8235;<b><span style=\"color:#F2ECDF\">الكرامة:<\/span><\/b> الطالب غاية ذات حرمة أم مورد وظيفي؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#D8CFBD\">&#8235;<b><span style=\"color:#F2ECDF\">العدل:<\/span><\/b> هل تتوزع الفرص والدعم والأعباء بإنصاف؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#D8CFBD\">&#8235;<b><span style=\"color:#F2ECDF\">الأمانة:<\/span><\/b> هل تُستخدم السلطة والبيانات لمصلحة المتعلم؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#D8CFBD\">&#8235;<b><span style=\"color:#F2ECDF\">الشورى:<\/span><\/b> هل يشارك أصحاب الشأن في القرار؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#D8CFBD\">&#8235;<b><span style=\"color:#F2ECDF\">المصلحة:<\/span><\/b> منفعة معتبرة بلا ضرر راجح؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#D8CFBD\">&#8235;<b><span style=\"color:#F2ECDF\">الإصلاح:<\/span><\/b> هل تسمح المؤسسة بالنقد والتغيير؟&#8236;<\/p>\n<\/div>\n<div style=\"width:640px;display:flex;flex-direction:column;gap:12px\">\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#142B27;background:#E1EFE7;border-radius:10px;padding:10px 16px\">&#8235;<b>الوظيفية<\/b> ← للوصف والتشخيص&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#142B27;background:#E6E3EE;border-radius:10px;padding:10px 16px\">&#8235;<b>النظرية النقدية<\/b> ← لكشف السلطة والصوت&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;color:#142B27;background:#F1E8D2;border-radius:10px;padding:10px 16px\">&#8235;<b>الأصول الإسلامية<\/b> ← للمعيار والغاية&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:12px;padding:20px 24px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;القواعد الأربع&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;line-height:1.35;color:#142B27\">&#8235;١ لا تكامل بلا عدل&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;line-height:1.35;color:#142B27\">&#8235;٢ لا استقرار بلا شرعية ومشاركة&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;line-height:1.35;color:#142B27\">&#8235;٣ لا فرز قبل إنصاف فرص الاستعداد&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;line-height:1.35;color:#142B27\">&#8235;٤ لا وظيفة مشروعة تختزل الإنسان&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(علي وفرج، 2009؛ الجمال، 2016؛ علي، 2013)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">25<\/p>", "notes": "يمكن تقويم أي سياسة أو ممارسة تعليمية وفق سبعة معايير:\n- التوحيد والغاية: هل تربط المعرفة بالمسؤولية والمعنى؟\n- الكرامة: هل يُعامل الطالب غاية ذات حرمة أم مورداً وظيفياً؟\n- العدل: هل تتوزع الفرص والدعم والأعباء بإنصاف؟\n- الأمانة: هل تُستخدم السلطة والبيانات لمصلحة المتعلم؟\n- الشورى: هل يشارك أصحاب الشأن في القرار؟\n- المصلحة: هل تحقق منفعة معتبرة بلا ضرر راجح؟\n- الإصلاح: هل تسمح المؤسسة بالنقد والتغيير أم تحمي ذاتها؟\n\nوتقدم الأدبيات المعاصرة في القيادة الإسلامية مبادئ الأمانة والعدل والشورى بوصفها محددات للحوكمة والمناهج والقيادة، لا إضافات وعظية هامشية؛ وتربط الشورى بالمشاركة ومنع التسلط.\n\nالتركيب المقترح: نفيد من الوظيفية في الوصف والتشخيص، ومن الأصول الإسلامية في المعيار والغاية، ومن النظرية النقدية في كشف السلطة والصوت. والنتيجة \"وظيفية نقدية قيمية\" تقوم على أربع قواعد: لا تكامل بلا عدل؛ ولا استقرار بلا شرعية ومشاركة؛ ولا فرز قبل إنصاف فرص الاستعداد؛ ولا وظيفة تعليمية مشروعة إذا اختزلت الإنسان أو حجبت قدرته على الإصلاح.\n\nسؤال متوقع: \"أليس إدخال المعيار الديني خروجاً عن الحياد العلمي؟\"\nالجواب: كل نظرية تحمل معياراً ضمنياً؛ فالوظيفية تجعل بقاء النسق معياراً. ونحن نصرّح بمعيارنا، وتوصيف ترب 600 ينص على تقويم الفكر التربوي بمنظور إسلامي.", "ntitle": "معايير التقويم والتركيب المقترح", "dark": false}, {"id": "case", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#142B27\">&#8235;الغياب وضعف التحصيل + نشاط تفاعلي ٤ من ٤&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;نموذج تطبيقي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(58px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;من تشديد العقوبة إلى التحليل الوظيفي النقدي&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:28px\">\n<table style=\"flex:1;font-size:calc(24px * var(--fs));color:#2F3D39;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6\">\n<tr style=\"background:#0F3A31\">\n<th style=\"width:72%;color:#F2ECDF;text-align:right\">&#8235;التحليل&#8236;<\/th>\n<th style=\"width:28%;color:#B98B3E;text-align:right\">&#8235;المحور&#8236;<\/th>\n<\/tr>\n<tr><td>&#8235;انتظام الحضور لحماية التعلم&#8236;<\/td><td>&#8235;<b>الوظيفة المعلنة<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;الطالب، الأسرة، النقل، الجدول، المناخ، المنهج، الصحة، التقويم&#8236;<\/td><td>&#8235;<b>النسق<\/b>&#8236;<\/td><\/tr>\n<tr><td>&#8235;إظهار الحزم ورفع الامتثال قصير الأجل&#8236;<\/td><td>&#8235;<b>كامن العقوبة<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;نفور الطلاب الأكثر حاجة، أو إخفاء أسباب بنيوية&#8236;<\/td><td>&#8235;<b>الاختلال المحتمل<\/b>&#8236;<\/td><\/tr>\n<tr><td>&#8235;توزيع الغياب بحسب المسافة والحالة والتحصيل ونوع الحصة&#8236;<\/td><td>&#8235;<b>تحليل العدالة<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;مقابلات قصيرة مع الطلاب والأسر والمعلمين&#8236;<\/td><td>&#8235;<b>الشورى<\/b>&#8236;<\/td><\/tr>\n<tr><td>&#8235;دعم نقل، إنذار مبكر، تعديل الجدول، إرشاد، تعليم تعويضي، ثم عقوبة متدرجة عادلة للإرادي&#8236;<\/td><td>&#8235;<b>البدائل<\/b>&#8236;<\/td><\/tr>\n<tr style=\"background:#F4EFE4\"><td>&#8235;الحضور، النمو التعلمي، الانتماء، عدالة الإجراء، استدامة التحسن&#8236;<\/td><td>&#8235;<b>المؤشرات<\/b>&#8236;<\/td><\/tr>\n<\/table>\n<div style=\"width:520px;display:flex;flex-direction:column;gap:12px;background:#0F3A31;border-radius:16px;padding:26px 28px\">\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:700;color:#0F3A31;background:#B98B3E;padding:6px 18px;border-radius:40px\">&#8235;ورشة البديل الوظيفي&#8236;<\/p>\n<svg class=\"draw\" viewBox=\"0 0 24 24\" style=\"color:#B98B3E;width:40px;height:40px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\" aria-hidden=\"true\"><circle pathLength=\"1\" cx=\"12\" cy=\"12\" r=\"10\"/><polyline pathLength=\"1\" points=\"12 6 12 12 16 14\" style=\"--o:.7s;--dur:.7s\"/><\/svg>\n<p style=\"font-size:calc(24px * var(--fs));color:#D8CFBD\">&#8235;٤ دقائق&#8236;<\/p>\n<\/div>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;كل ثلاث متجاورات يقترحن:&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;١ · بديلاً وظيفياً واحداً للعقوبة يعالج سبباً بنيوياً&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;٢ · مؤشراً واحداً يثبت نجاحه&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;٣ · معياراً قيمياً يحققه&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#B98B3E\">&#8235;البديل الأكثر أخلاقية قد يكون الأكثر كفاءة؛ لأنه يعالج السبب.&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(نموذج تطبيقي مقترح، مبني على: Merton, 1968؛ OECD, 2024) · الورشة من إعداد الباحثتين&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">26<\/p>", "notes": "لنفترض أن مدرسة لاحظت ارتفاع الغياب وضعف التحصيل. قد يعالج المنظور الإداري الضيق المشكلة بتشديد العقوبة. أما التحليل الوظيفي النقدي فيسير كالآتي:\n- الوظيفة المعلنة: انتظام الحضور لحماية التعلم.\n- النسق: الطالب، الأسرة، النقل، الجدول، المناخ، صعوبة المنهج، الصحة، التقويم.\n- الوظيفة الكامنة للعقوبة: إظهار الحزم ورفع الامتثال قصير الأجل.\n- الاختلال المحتمل: زيادة نفور الطلاب الأكثر حاجة، أو إخفاء أسباب بنيوية.\n- تحليل العدالة: توزيع الغياب بحسب المسافة والحالة والتحصيل ونوع الحصة.\n- الشورى: مقابلات قصيرة مع الطلاب والأسر والمعلمين.\n- البدائل: دعم نقل، إنذار مبكر، تعديل الجدول، إرشاد، تعليم تعويضي، ثم عقوبة متدرجة عادلة للحالات الإرادية.\n- المؤشرات: الحضور، النمو التعلمي، الانتماء، العدالة في تطبيق الإجراء، واستدامة التحسن.\n\nورشة البديل الوظيفي (4 دقائق):\n١. (دقيقتان) كل ثلاث طالبات متجاورات يتفقن على بديل وظيفي للعقوبة، ومؤشر لقياس نجاحه، ومعيار قيمي يحققه.\n٢. (دقيقة ونصف) الاستماع إلى ثلاث مجموعات وكتابة البدائل على السبورة.\n٣. (30 ثانية) التعقيب.\n\nأمثلة متوقعة: \"صديق الحضور\" — مؤشره نسبة الحضور الأسبوعي — معياره التكافل؛ \"حصة تعويضية مرنة\" — مؤشرها درجات الاختبارات القصيرة — معيارها العدل؛ \"اتصال ودي من الموجّه قبل الإنذار\" — مؤشره عودة الطالب خلال أسبوع — معياره الكرامة والشورى.\n\nالتعقيب: يكشف المثال أن الضبط وظيفة ضرورية، لكنه لا ينجح إذا عُزل عن بقية النسق، وأن البديل الأكثر أخلاقية قد يكون أكثر كفاءة وظيفية لأنه يعالج السبب ولا يدفع المشكلة خارج مجال الرؤية.", "ntitle": "نموذج تطبيقي + نشاط تفاعلي ٤", "dark": false}, {"id": "results", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;ثماني نتائج&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;النتائج&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(60px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;ما الذي خلص إليه العرض؟&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:10px;padding:14px 18px\">&#8235;١ · التربية آلية اجتماعية لإعادة إنتاج شروط البقاء والتضامن وتوزيع الأدوار، لا نشاط فردي فقط.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:10px;padding:14px 18px\">&#8235;٢ · دوركايم أسس أخلاقياً، وبارسونز نقل الطالب إلى العمومية والإنجاز، وميرتون أدخل الكامن والاختلال والبدائل.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:10px;padding:14px 18px\">&#8235;٣ · وظائف متعارضة أحياناً: التجانس والتمايز، الانضباط والاستقلال، التكافؤ والفرز، الحفظ والتجديد.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:10px;padding:14px 18px\">&#8235;٤ · القيادة تنسيق للنسق، لكنها تصبح محافظة إن جعلت الاستقرار غاية أو أغفلت توزيع القوة.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px\">\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">&#8235;٥ · توحيد المعايير لا يكفي للعدالة؛ يلزم تكافؤ فرص الاستعداد وفحص الأثر التفاضلي.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:10px;padding:14px 18px\">&#8235;٦ · المدرسة قد تمنح الامتياز الثقافي السابق صورة الجدارة المحايدة.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #B98B3E;border-radius:10px;padding:14px 18px\">&#8235;٧ · المنظور الإسلامي يجعل العدل والكرامة والأمانة والشورى والإصلاح فوق بقاء النسق.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #B98B3E;border-radius:10px;padding:14px 18px\">&#8235;٨ · «الوظيفية النقدية القيمية» تلائم السياق السعودي: هوية وتكامل وتنمية قدرات مع إنصاف ومشاركة.&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(خلاصة العرض؛ انظر المراجع في الشرائح السابقة)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">27<\/p>", "notes": "- تفسر الوظيفية التربية بوصفها آلية اجتماعية لإعادة إنتاج شروط بقاء المجتمع، وبناء التضامن، وتوزيع الأدوار، لا بوصفها نشاطاً فردياً فقط.\n- صاغ دوركايم الأساس الأخلاقي والاجتماعي للتربية؛ وصاغ بارسونز انتقال الطالب من المعايير الأسرية الخصوصية إلى المعايير العامة والإنجاز؛ وصحح ميرتون النظرية بإدخال الوظائف الكامنة والاختلال والبدائل.\n- المدرسة تؤدي وظائف متعارضة أحياناً: التجانس والتمايز، الانضباط والاستقلال، تكافؤ الفرص والفرز، حفظ القيم وتجديدها.\n- تساعد الوظيفية في تحليل القيادة باعتبارها تنسيقاً للنسق، لكنها تصبح محافظة إذا جعلت الاستقرار غاية نهائية أو أغفلت توزيع القوة.\n- لا يكفي توحيد المعايير لتحقيق العدالة؛ إذ ينبغي تكافؤ فرص الاستعداد والدعم، وفحص الأثر التفاضلي للسياسة.\n- تكشف نظريات الصراع وإعادة الإنتاج أن المدرسة قد تمنح الامتياز الثقافي السابق صورة الجدارة المحايدة.\n- يثري المنظور الإسلامي التحليل بجعل العدل والكرامة والأمانة والشورى والإصلاح معايير فوق مجرد بقاء النسق.\n- تلائم \"الوظيفية النقدية القيمية\" حاجات القيادة والسياسات في السياق السعودي؛ لأنها تجمع الهوية والتكامل وتنمية القدرات مع الإنصاف والمشاركة والتعلم المؤسسي.", "ntitle": "النتائج", "dark": false}, {"id": "recs", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html":
