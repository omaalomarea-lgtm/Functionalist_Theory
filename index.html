<style>
/* ============================================================
   Palette — emerald · dignified purple · calm gold · ivory
   ============================================================ */
:root{
  --emerald-900:#0B2E27; --emerald-800:#0F3A31; --emerald-600:#17694F; --emerald-100:#E1EFE7;
  --purple-700:#5A3480; --purple-600:#6E3F94; --purple-jouf:#7B4FA0; --purple-100:#EEE6F3;
  --gold-600:#B98B3E; --gold-700:#8C6420; --gold-100:#F1E8D2;
  --ivory:#F8F4EA; --ivory-2:#F3EEE2; --ink:#142B27; --muted:#5C6663;
  --ease:cubic-bezier(0.16,1,0.3,1);
  --ease-2:cubic-bezier(0.22,1,0.36,1);
  --spring:cubic-bezier(0.34,1.56,0.64,1);
  --fs:1;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0A1B17;overflow:hidden}
body{font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---------- viewport & stage ---------- */
#viewport{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(1200px 700px at 70% 20%,rgba(23,105,79,.28),transparent 60%),
             radial-gradient(900px 600px at 20% 90%,rgba(110,63,148,.22),transparent 60%),#0A1B17}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;
  border-radius:6px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);background:var(--ivory)}

/* Slide canvas: authored markup keeps its own visual RTL (row-reverse + embedding marks) */
.slide{position:absolute;inset:0;width:1920px;height:1080px;direction:ltr;unicode-bidi:isolate;
  overflow:hidden;isolation:isolate;opacity:0;visibility:hidden;
  transition:opacity .55s var(--ease-2),visibility 0s linear .55s}
.slide.active{opacity:1;visibility:visible;transition:opacity .7s var(--ease-2),visibility 0s}
.slide *{margin:0}
.slide p,.slide h1,.slide h2,.slide h3{overflow-wrap:break-word}
.slide b{font-weight:700}
.slide aside{display:none}
.slide table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border-radius:14px;overflow:hidden}
.slide th{padding:16px 22px;font-weight:700;line-height:1.35;vertical-align:middle}
.slide td{padding:14px 22px;line-height:1.42;vertical-align:top;border-top:1px solid rgba(20,43,39,.08)}
.slide img{display:block}

/* ambient light layer (transform-only drift) */
.slide::before{content:"";position:absolute;inset:-12%;z-index:-1;pointer-events:none;
  background:radial-gradient(42% 38% at 82% 18%,rgba(23,105,79,.07),transparent 70%),
             radial-gradient(36% 34% at 12% 86%,rgba(123,79,160,.06),transparent 70%),
             radial-gradient(30% 26% at 50% 60%,rgba(185,139,62,.05),transparent 70%);
  transform:translate3d(0,0,0);will-change:transform}
.slide.active::before{animation:drift 26s ease-in-out infinite alternate}
.slide.dark::before{background:radial-gradient(48% 42% at 80% 16%,rgba(185,139,62,.12),transparent 70%),
             radial-gradient(40% 40% at 10% 90%,rgba(123,79,160,.16),transparent 70%)}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-2.5%,1.8%,0) scale(1.04)}}

/* ---------- choreographed entrance ---------- */
.u{opacity:0;translate:0 26px;
  transition:opacity .5s var(--ease-2) 0s,translate .5s var(--ease-2) 0s,transform .55s var(--spring),scale .5s var(--ease)}
.u.hd{translate:0 34px}
.u.ft{translate:0 10px}
.u.side{translate:-22px 0}
.slide.in .u{opacity:1;translate:0 0;
  transition:opacity .9s var(--ease) var(--d,0s),translate 1.1s var(--ease) var(--d,0s),transform .55s var(--spring),scale 1.1s var(--ease) var(--d,0s)}
.card.u{scale:.975}
.slide.in .card.u{scale:1}
tr.u{translate:0 14px}
.bar-y{transform-origin:50% 0;scale:1 0;transition:scale .3s var(--ease)}
.slide.in .bar-y{scale:1 1;transition:scale 1.4s var(--ease) .05s}
.rule-x{transform-origin:100% 50%;scale:0 1;transition:scale .3s var(--ease)}
.slide.in .rule-x{scale:1 1;transition:scale 1.3s var(--ease) var(--d,.3s)}

/* ---------- SVG line drawing ---------- */
.draw path,.draw line,.draw circle,.draw polyline{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s var(--ease)}
.slide.in .draw path,.slide.in .draw line,.slide.in .draw circle,.slide.in .draw polyline{stroke-dashoffset:0;
  transition:stroke-dashoffset var(--dur,1.4s) var(--ease-2) calc(var(--d,0s) + var(--o,0s))}
.draw .fill{opacity:0;transition:opacity .3s;stroke-dasharray:none!important;stroke-dashoffset:0!important}
.slide.in .draw .fill{opacity:1;transition:opacity .6s var(--ease) calc(var(--d,0s) + var(--o,0s) + .5s)}
.h-rule{position:absolute;right:0;bottom:-14px;width:260px;height:14px;overflow:visible;pointer-events:none}
.corner{position:absolute;left:-34px;top:-34px;width:150px;height:150px;opacity:.55;pointer-events:none}
.connector{position:absolute;pointer-events:none;overflow:visible}

/* ---------- cards: glass, gold glow, lift ---------- */
.card{position:relative;will-change:transform}
.card.glass-dark{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.card.glass{-webkit-backdrop-filter:blur(8px) saturate(1.15);backdrop-filter:blur(8px) saturate(1.15)}
.card::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:0;
  box-shadow:0 0 0 1px rgba(185,139,62,.55),0 22px 44px -22px rgba(185,139,62,.55),0 0 34px -6px rgba(185,139,62,.28);
  transition:opacity .45s var(--ease)}
.card.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(160deg,rgba(255,255,255,.65),rgba(255,255,255,0) 42%);opacity:.7}
.slide.in .card:hover{transform:translateY(-6px) scale(1.012)}
.slide.in .card:hover::after{opacity:1}
.slide.in tr.u:hover td{background-image:linear-gradient(rgba(185,139,62,.07),rgba(185,139,62,.07))}

/* ---------- chrome: progress, toolbar, notes ---------- */
#progress{position:fixed;top:0;right:0;left:0;height:4px;z-index:20;background:rgba(255,255,255,.06)}
#progress i{position:absolute;inset:0;transform-origin:100% 50%;transform:scaleX(0);
  background:linear-gradient(270deg,var(--emerald-600),var(--gold-600) 60%,var(--purple-jouf));
  transition:transform .9s var(--ease)}
#ticks{position:fixed;top:10px;right:24px;display:flex;gap:6px;z-index:20;direction:rtl}
#ticks button{all:unset;cursor:pointer;width:22px;height:4px;border-radius:4px;background:rgba(255,255,255,.18);position:relative;overflow:hidden}
#ticks button::after{content:"";position:absolute;inset:0;background:var(--gold-600);transform:scaleX(0);transform-origin:100% 50%;transition:transform .6s var(--ease)}
#ticks button.on::after{transform:scaleX(1)}
#ticks button:focus-visible{outline:2px solid var(--gold-600);outline-offset:3px}

#bar{position:fixed;left:50%;top:16px;z-index:30;display:flex;align-items:center;gap:6px;direction:rtl;
  padding:8px 10px;border-radius:999px;transform:translateX(-50%);
  background:rgba(14,40,34,.62);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);
  box-shadow:0 18px 40px -20px rgba(0,0,0,.6);color:#F2ECDF;font-size:14px;
  transition:opacity .5s var(--ease),transform .6s var(--ease)}
body.idle #bar{opacity:0;transform:translate(-50%,-14px);pointer-events:none}
#bar button{all:unset;cursor:pointer;display:grid;place-items:center;min-width:38px;height:38px;padding:0 10px;border-radius:999px;
  color:#F2ECDF;font:600 14px 'IBM Plex Sans Arabic',sans-serif;transition:transform .4s var(--spring),background-color .3s}
#bar button:hover{background-color:rgba(255,255,255,.1);transform:translateY(-2px)}
#bar button:active{transform:scale(.94)}
#bar button:focus-visible{outline:2px solid var(--gold-600);outline-offset:2px}
#bar button:disabled{opacity:.3;cursor:default;transform:none}
#bar button[aria-pressed="true"]{background-color:rgba(185,139,62,.28)}
#bar svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#bar .sep{width:1px;height:22px;background:rgba(255,255,255,.16);margin:0 4px}
#count{direction:ltr;min-width:86px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.5px}
#count b{color:#E2C489;font-weight:700}
#sect{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#BFD3CB;padding:0 6px;font-size:13px}
#fsv{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;color:#BFD3CB;font-size:13px}

#notes{position:fixed;right:24px;left:24px;bottom:20px;z-index:25;max-height:38vh;overflow:auto;direction:rtl;
  padding:22px 28px;border-radius:18px;color:#ECE6D8;background:rgba(10,30,26,.86);border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  font:400 calc(17px * var(--fs)) / 1.85 'IBM Plex Sans Arabic',sans-serif;white-space:pre-wrap;
  opacity:0;transform:translateY(24px);pointer-events:none;transition:opacity .45s var(--ease),transform .6s var(--ease)}
#notes.open{opacity:1;transform:none;pointer-events:auto}
#notesTitle{font:700 calc(26px * var(--fs))/1.4 'Amiri',serif;color:#F2ECDF;margin:0 0 12px;white-space:normal}
#notes h4{margin:0 0 8px;font:700 13px 'IBM Plex Sans Arabic';letter-spacing:1px;color:#E2C489}

#hint{position:fixed;top:22px;left:24px;z-index:20;color:rgba(242,236,223,.55);font-size:12.5px;direction:rtl;transition:opacity .6s}
body.idle #hint{opacity:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- reduced motion ---------- */
@media (prefers-reduced-motion: reduce){
  .u,.slide.in .u{translate:none!important;scale:none!important;transition:opacity .25s linear!important}
  .card.u{scale:none}
  .bar-y,.rule-x,.slide.in .bar-y,.slide.in .rule-x{scale:1 1!important;transition:none!important}
  .draw path,.draw line,.draw circle,.draw polyline{stroke-dashoffset:0!important;transition:none!important}
  .draw .fill{opacity:1!important;transition:none!important}
  .slide.active::before{animation:none}
  .slide.in .card:hover{transform:none}
  #progress i,#ticks button::after,#bar,#notes{transition-duration:.01s!important}
}
@media print{#bar,#notes,#progress,#ticks,#hint{display:none}}
</style>
</head>

<main id="viewport"><div id="stage" role="region" aria-roledescription="عرض تقديمي" aria-live="polite"></div></main>

<aside id="notes" aria-hidden="true"><h4>ملاحظات</h4><div id="notesTitle"></div><div id="notesBody"></div></aside>

<div id="bar" role="toolbar" aria-label="أدوات العرض">

  <span class="sep"></span>

 var(--fs));font-weight:600;color:#7B4FA0;text-align:center\">&#8235;إشراف&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(52px * var(--fs));font-weight:700;color:#142B27;text-align:center\">&#8235;الدكتورة نعيمة الدرعان&#8236;<\/p>\n<\/div>\n<\/div>", "notes": "بسم الله الرحمن الرحيم. الدكتورة نعيمة الدرعان، الزميلات الكريمات، السلام عليكم ورحمة الله.\n\nنقدّم اليوم عرضاً بعنوان \"النظرية الوظيفية في علم اجتماع التربية وتطبيقاتها التربوية والقيادية\". يتناول العرض نشأة النظرية المعرفية، ومفاهيمها المركزية، وإسهامات دوركايم وبارسونز وميرتون، ثم يحلل المدرسة والقيادة والسياسات التعليمية في ضوئها.\n\nوننطلق من أن الوظيفية قدّمت تفسيراً كلياً مهماً للعلاقة بين التربية والمجتمع؛ إذ ترى المدرسة جزءاً من نسق مترابط يؤدي وظائف التنشئة، ونقل القيم، والضبط، وإنتاج التضامن، والفرز، وتأهيل القوى العاملة. غير أن قيمة هذا التفسير لا تكتمل إلا إذا ضُبط بنقد يكشف افتراضاته حول الإجماع والجدارة وتكافؤ الفرص، ويختبر قدرته على تفسير اللامساواة والصراع والتغير الجذري.", "ntitle": "الافتتاح", "dark": false}, {"id": "problem", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:32px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;المقدمة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;التربية لا تقع في فراغ اجتماعي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;من «كيف نعلّم؟» إلى «لماذا نربي؟»&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:32px;align-items:center\">\n<div style=\"width:420px;display:flex;flex-direction:column;gap:12px;background:#ECE5D6;border-radius:16px;padding:32px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;السؤال الإجرائي التقليدي&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(56px * var(--fs));font-weight:700;color:#8A928F;text-decoration:line-through #6E3F94\">&#8235;كيف نعلّم؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;لا يكفي وحده&#8236;<\/p>\n<\/div>\n<svg class=\"draw\" viewBox=\"0 0 96 48\" style=\"width:96px;height:48px;flex:none;overflow:visible\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M90 24 H8\" fill=\"none\" stroke=\"#B98B3E\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"--dur:.9s;--o:.2s\"/><path pathLength=\"1\" d=\"M28 6 L6 24 L28 42\" fill=\"none\" stroke=\"#B98B3E\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"--dur:.6s;--o:.85s\"/><\/svg>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<p style=\"flex:1;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#142B27;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:20px 28px\">&#8235;لماذا نربي؟&#8236;<\/p>\n<p style=\"flex:1;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#142B27;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:20px 28px\">&#8235;من نربي؟&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<p style=\"flex:1;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#142B27;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:20px 28px\">&#8235;لأي مجتمع؟&#8236;<\/p>\n<p style=\"flex:1;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#142B27;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:20px 28px\">&#8235;من يحدد المعرفة الجديرة بالنقل؟&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#0F3A31;border-radius:16px;padding:28px 40px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;لماذا الوظيفية؟&#8236;<\/p>\n<p style=\"font-size:calc(28px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;لأنها من أكثر النظريات تأثيراً في تفسير دور التعليم في استمرار المجتمع: من المماثلة العضوية عند سبنسر، إلى التضامن عند دوركايم، فالنسق عند بارسونز، فالظاهر والكامن والاختلال عند ميرتون.&#8236;<\/p>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(علي، 2013، فصل الأصول الاجتماعية؛ الجمال، 2016، الفصل التمهيدي)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">02<\/p>", "notes": "لا تقع التربية في فراغ اجتماعي؛ فهي من جهة تتشكل في ضوء ثقافة المجتمع وبنيته الاقتصادية والسياسية ونظامه القيمي، ومن جهة أخرى تعيد تشكيل المجتمع بتكوين أعضائه، ونقل تراثه، وتوزيع فرصه، وإعداد قواه البشرية.\n\nولهذا لا يكفي أن نسأل: كيف نعلّم؟ بل ينبغي أن تسبق ذلك أسئلة: لماذا نربي؟ ومن نربي؟ ولأي مجتمع؟ ومن يحدد المعرفة والقيم الجديرة بالنقل؟ وتؤكد أدبيات أصول التربية أن فهم الظاهرة التربوية يقتضي ردّها إلى القوى الاجتماعية والثقافية المؤثرة فيها، لا اختزالها في نمو الفرد النفسي وحده (علي، 2013؛ الجمال، 2016).\n\nوتبرز النظرية الوظيفية هنا لأنها من أكثر النظريات تأثيراً في تفسير دور التعليم في استمرار المجتمع الحديث. فهي تفهم المجتمع نسقاً من مؤسسات مترابطة، وتبحث في إسهام كل مؤسسة في البقاء والتكيف والتكامل وتحقيق الأهداف وصيانة الأنماط القيمية. وقد انتقل هذا المنظور من المماثلة العضوية لدى سبنسر، إلى تحليل التضامن عند دوركايم، ثم نظرية النسق عند بارسونز، وأخيراً الصياغة الأكثر تحفظاً لدى ميرتون الذي فرّق بين الوظائف والاختلالات، وبين النتائج الظاهرة والكامنة.\n\nوتتأكد أهمية الموضوع لمقرر ترب 600؛ لأن توصيفه يطلب تفسير العلاقة بين التربية والمجتمع في ضوء النظريات الاجتماعية، والتمييز بين الأسس الاجتماعية وتطبيقاتها، ومناقشة الفكر التربوي وفق المنظور الإسلامي.", "ntitle": "المقدمة", "dark": false}, {"id": "questions", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;السؤال الرئيس والأسئلة الفرعية والأهداف&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;المقدمة&#8236;<\/p>\n<\/div>\n<div style=\"background:#0F3A31;border-radius:16px;padding:24px 36px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));line-height:1.45;color:#F2ECDF\">&#8235;كيف تفسر الوظيفية العلاقة بين التربية والمجتمع؟ وما تطبيقاتها في المدرسة والقيادة والسياسات التعليمية؟ وما حدودها في ضوء نظريات الصراع والفلسفة التربوية الإسلامية؟&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:32px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:10px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;الأسئلة الفرعية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:10px;padding:10px 18px\">&#8235;١ · ما الجذور المعرفية للوظيفية ومفاهيمها المحورية؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:10px;padding:10px 18px\">&#8235;٢ · كيف فسّر دوركايم وبارسونز وميرتون وظائف التربية؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:10px;padding:10px 18px\">&#8235;٣ · كيف تنعكس على المنهج والتقويم وتكافؤ الفرص والسياسات؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:10px;padding:10px 18px\">&#8235;٤ · ما دور قائد المدرسة والمشرف التربوي داخل النسق؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:10px;padding:10px 18px\">&#8235;٥ · ما قوتها وقصورها مقارنة بنظريات الصراع والنقد؟&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:10px;padding:10px 18px\">&#8235;٦ · كيف نبني توظيفاً وظيفياً نقدياً منضبطاً بالأصول الإسلامية؟&#8236;<\/p>\n<\/div>\n<div style=\"width:620px;display:flex;flex-direction:column;gap:10px\">\n<p style=\"font-size:calc(26px * var(--fs));font-weight:700;color:#142B27\">&#8235;الأهداف&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;border-right:4px solid #17694F;padding:6px 16px 6px 0\">&#8235;تأصيل الوظيفية تاريخياً ومعرفياً&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;border-right:4px solid #17694F;padding:6px 16px 6px 0\">&#8235;تحليل العلاقة بين التربية والمجتمع&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;border-right:4px solid #17694F;padding:6px 16px 6px 0\">&#8235;تفسير الوظائف الظاهرة والكامنة واختلالاتها&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;border-right:4px solid #17694F;padding:6px 16px 6px 0\">&#8235;بيان التطبيقات القيادية والسياساتية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;border-right:4px solid #6E3F94;padding:6px 16px 6px 0\">&#8235;نقد افتراضات الإجماع والجدارة والحياد&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4;border-right:4px solid #6E3F94;padding:6px 16px 6px 0\">&#8235;منظور يجمع التكامل والعدل والشورى والإصلاح&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الأهمية: نظرياً تربط أصول التربية بعلم الاجتماع التربوي ونظريات القيادة؛ وتطبيقياً تحوّل المفاهيم إلى أدوات لتشخيص المدرسة&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">03<\/p>", "notes": "السؤال الرئيس: كيف تفسر النظرية الوظيفية العلاقة بين التربية والمجتمع، وما تطبيقاتها في المدرسة والقيادة والسياسات التعليمية، وما حدودها في ضوء نظريات الصراع والفلسفة التربوية الإسلامية؟\n\nويتفرع عنه ستة أسئلة: الجذور المعرفية والمفاهيم المحورية؛ وتفسير دوركايم وبارسونز وميرتون لوظائف التربية؛ وانعكاس الوظيفية على المنهج والتقويم وتكافؤ الفرص والسياسات؛ ودور قائد المدرسة والمشرف التربوي داخل النسق؛ وأوجه القوة والقصور مقارنة بنظريات الصراع والنقد؛ وأخيراً كيف نبني توظيفاً وظيفياً نقدياً منضبطاً بالأصول الاجتماعية الإسلامية.\n\nوالأهداف ستة مقابلة: تأصيل النظرية تاريخياً ومعرفياً، وتحليل العلاقة بين التربية والمجتمع، وتفسير الوظائف الظاهرة والكامنة واختلالاتها، وبيان التطبيقات القيادية والسياساتية، ونقد افتراضات الإجماع والجدارة والحياد المؤسسي، وصياغة منظور يجمع التكامل والعدل والشورى والإصلاح.\n\nأما الأهمية: فنظرياً، الربط بين أصول التربية وعلم الاجتماع التربوي ونظريات القيادة بدل دراستها منفصلة. وتطبيقياً، تحويل المفاهيم الوظيفية إلى أدوات لتشخيص المدرسة: ما وظائفها؟ لمن تؤديها؟ ما نتائجها غير المقصودة؟ وما الاختلالات التي قد تخفيها مؤشرات الأداء؟ ويتسق ذلك مع رسالة قسم القيادة والسياسات التربوية بجامعة الجوف في إعداد قيادات تتخذ القرار المبني على المعرفة.", "ntitle": "أسئلة العرض وأهدافه", "dark": false}, {"id": "roots", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;النشأة المعرفية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الإطار المفاهيمي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;المجتمع جسدٌ… والمدرسة أحد أجهزته الحيوية&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:32px\">\n<div style=\"width:520px;display:flex;flex-direction:column;gap:12px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#142B27\">&#8235;من الوضعية إلى النسق&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:12px;padding:14px 20px\">\n<p style=\"width:120px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;color:#142B27\">&#8235;كونت&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(24px * var(--fs))\">&#8235;ندرس المجتمع بالملاحظة كالطبيعة&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:12px;padding:14px 20px\">\n<p style=\"width:120px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;color:#142B27\">&#8235;سبنسر&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(24px * var(--fs))\">&#8235;المماثلة العضوية: نمو وتمايز&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:12px;padding:14px 20px\">\n<p style=\"width:120px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;color:#142B27\">&#8235;دوركايم&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(24px * var(--fs))\">&#8235;الواقعية الاجتماعية والتضامن&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #17694F;border-radius:12px;padding:14px 20px\">\n<p style=\"width:120px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;color:#142B27\">&#8235;بارسونز&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(24px * var(--fs))\">&#8235;النسق وتوازنه (AGIL)&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-right:6px solid #6E3F94;border-radius:12px;padding:14px 20px\">\n<p style=\"width:120px;font-family:'Amiri', 'Times New Roman', serif;font-size:calc(30px * var(--fs));font-weight:700;color:#142B27\">&#8235;ميرتون&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(24px * var(--fs))\">&#8235;الوظيفة والاختلال معاً&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:16px\">\n<div style=\"display:flex;flex-direction:column;gap:12px;background:#0F3A31;border-radius:16px;padding:28px 32px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;التشبيه الذهني&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;المجتمع جسد، ومؤسساته أعضاء: الأسرة والاقتصاد والدولة والمدرسة.&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;المدرسة كجهاز الهضم: تستقبل أطفالاً وتحوّلهم إلى طاقة نافعة للجسد كله.&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px;background:#E1EFE7;border-radius:12px;padding:22px 28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;إبستمولوجياً: الواقعية الاجتماعية&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;الوقائع الاجتماعية خارجية ومُلزِمة؛ فالتربية آلية مؤسسية لإنتاج العضو الاجتماعي.&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px;background:#EEE6F3;border-radius:12px;padding:22px 28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;المماثلة ليست تطابقاً&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;العضو لا يعترض، والإنسان يفسّر القاعدة ويغيّرها؛ ويُفصل سؤال السبب عن سؤال الوظيفة.&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(الجمال، 2016؛ علي، 2013؛ دوركايم، 1895، كما ورد في عرض ثانوي)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">04<\/p>", "notes": "ترتبط الجذور البعيدة للوظيفية بفكرة أن الكل الاجتماعي يسبق أجزاءه من حيث المعنى، وأن فهم المؤسسة يمر بوظيفتها في الكل. ومع الوضعية عند أوغست كونت ظهر طموح دراسة المجتمع بالملاحظة واكتشاف الانتظامات على مثال العلوم الطبيعية، ثم صاغ سبنسر المماثلة العضوية: المجتمع كالكائن الحي، ينمو ويتمايز، وتزداد أجزاؤه تخصصاً واعتماداً متبادلاً.\n\nوالتشبيه المقرّب: المجتمع جسد، ومؤسساته أعضاء. والمدرسة كجهاز الهضم: تستقبل أطفالاً بخصائص متنوعة، وتحوّلهم إلى أعضاء قادرين على الإسهام في حياة الجسد كله.\n\nغير أن المماثلة ليست تطابقاً. فالعضو البيولوجي لا يمتلك وعياً أخلاقياً أو قدرة على الاعتراض، بينما الفاعل الاجتماعي يفسر القواعد ويقاومها ويغيرها. لذلك تكون المماثلة أداة أولية لفهم الاعتماد المتبادل، لا برهاناً على أن كل مؤسسة قائمة نافعة أو عادلة. وقد شدد دوركايم نفسه على فصل البحث عن سبب الظاهرة عن البحث في وظيفتها (دوركايم، 1895، كما ورد في عرض ثانوي).\n\nإبستمولوجياً، تميل الوظيفية الكلاسيكية إلى الواقعية الاجتماعية والوضعية: الوقائع الاجتماعية خارجية نسبياً عن الفرد، وتمارس عليه إلزاماً. ويترتب على ذلك أن التربية ليست شأناً فردياً محضاً، بل آلية مؤسسية لإنتاج العضو الاجتماعي المطلوب. إلا أن هذا المنظور قد ينزلق إلى التشييء إذا تعامل مع \"حاجات المجتمع\" كأنها صوت واحد مستقل عن مصالح الجماعات وتفاوت القوة بينها.", "ntitle": "النشأة المعرفية", "dark": false}, {"id": "system", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;النسق الاجتماعي · الوظيفة والاختلال&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الإطار المفاهيمي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;المدرسة نقطة تفاعل في نسق مترابط&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:36px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:14px\">\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.5;color:#142B27\">&#8235;<b>النسق:<\/b> شبكة مستقرة نسبياً من الأدوار والمؤسسات والمعايير والعلاقات.&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:10px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:40px;padding:8px 22px\">&#8235;الأسرة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:40px;padding:8px 22px\">&#8235;الاقتصاد&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:40px;padding:8px 22px\">&#8235;الدولة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:40px;padding:8px 22px\">&#8235;الدين&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:40px;padding:8px 22px\">&#8235;الإعلام&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:40px;padding:8px 22px\">&#8235;المجتمع المحلي&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:18px 22px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;حين يتوتر النسق&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;سوق عمل يتغير ومنهج ثابت، أو أسرة تتغير ودعم طلابي ثابت ← بطالة خريجين، ضعف انتماء، تعثر أكاديمي.&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:18px 22px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;ما تفيده القيادة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;رؤية الترابط · تتبع تدفق الموارد والمعلومات · توقع الأثر غير المباشر للقرار&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"width:640px;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;flex-direction:column;gap:8px;background:#0F3A31;border-radius:12px;padding:22px 26px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#A6DCC3\">&#8235;الوظيفة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;نتيجة موضوعية تسهم في تكيّف النسق أو استمراره.&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:8px;background:#0F3A31;border-radius:12px;padding:22px 26px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#D7C0EC\">&#8235;الاختلال الوظيفي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;نتيجة تقلل القدرة على التكيف أو تهدد التكامل؛ وقد تكون الظاهرة وظيفية لفئة ومختلة لأخرى.&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;background:#F1E8D2;border-radius:12px;padding:18px 22px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#8C6420\">&#8235;مثال&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;تعليم موحد للغة الوطنية: يبني التواصل والهوية، وقد يُقصي إن أهمل متعلمي اللغات المختلفة.&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Merton, 1968)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">05<\/p>", "notes": "النسق الاجتماعي شبكة مستقرة نسبياً من الأدوار والمؤسسات والمعايير والعلاقات. لا تُفهم المدرسة داخله مبنى أو جهازاً إدارياً منفرداً، بل نقطة تفاعل بين الأسرة والاقتصاد والدولة والدين والإعلام والمجتمع المحلي. فإذا تغير سوق العمل دون أن يتغير المنهج، أو تغيرت بنية الأسرة دون تطوير الدعم الطلابي، نشأ توتر قد يظهر في صورة بطالة خريجين أو ضعف انتماء أو تعثر أكاديمي.\n\nوتفيد فكرة النسق القيادة في ثلاثة أمور: رؤية الترابط، وتتبع تدفق الموارد والمعلومات، وتوقع الأثر غير المباشر للقرار. لكن النسقية لا تعني أن الاستقرار هو القيمة العليا؛ فقد يكون النسق مستقراً وهو غير عادل.\n\nالوظيفة هي النتيجة الموضوعية التي تسهم في تكيف النسق أو استمراره، أما الاختلال الوظيفي فنتيجة تقلل القدرة على التكيف أو تهدد التكامل. وقد نبّه ميرتون إلى أن الظاهرة الواحدة قد تكون وظيفية لفئة ومختلة لفئة أخرى، وأن تقويمها يقتضي تحديد وحدة التحليل وميزان النتائج الصافية (Merton, 1968).\n\nمثال: تعليم موحد للغة الوطنية قد يؤدي وظيفة ظاهرة هي التواصل وبناء الهوية، ووظيفة كامنة هي توسيع شبكات العلاقات، لكنه قد يحدث اختلالاً إن أهمل حاجات متعلمي اللغات المختلفة أو حوّل التنوع إلى سبب للإقصاء.", "ntitle": "النسق والوظيفة والاختلال", "dark": false}, {"id": "merton-matrix", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;الظاهر والكامن&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الإطار المفاهيمي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(56px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;تشريح الممارسات: الظاهر والكامن والمختل&#8236;<\/h2>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27\">&#8235;<b>الظاهرة:<\/b> نتائج مقصودة ومعترف بها · <b>الكامنة:<\/b> نتائج غير مقصودة أو غير معترف بها&#8236;<\/p>\n<table style=\"font-size:calc(24px * var(--fs));color:#2F3D39;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6\">\n<tr style=\"background:#0F3A31\">\n<th style=\"width:29%;color:#D7C0EC;text-align:right\">&#8235;الاختلال المحتمل&#8236;<\/th>\n<th style=\"width:27%;color:#F2ECDF;text-align:right\">&#8235;الوظيفة الكامنة المحتملة&#8236;<\/th>\n<th style=\"width:26%;color:#F2ECDF;text-align:right\">&#8235;الوظيفة الظاهرة&#8236;<\/th>\n<th style=\"width:18%;color:#B98B3E;text-align:right\">&#8235;الممارسة&#8236;<\/th>\n<\/tr>\n<tr>\n<td>&#8235;تضييق المنهج، قلق الاختبار، تحيز الفرص&#8236;<\/td>\n<td>&#8235;ثقافة تنافسية وترتيب السمعة&#8236;<\/td>\n<td>&#8235;قياس التحصيل والمقارنة&#8236;<\/td>\n<td>&#8235;<b>الاختبارات الموحدة<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;امتثال شكلي أو تجاهل ظروف الأسرة&#8236;<\/td>\n<td>&#8235;بناء هوية وانتماء&#8236;<\/td>\n<td>&#8235;الانضباط وتقليل الفروق الظاهرة&#8236;<\/td>\n<td>&#8235;<b>الزي المدرسي<\/b>&#8236;<\/td>\n<\/tr>\n<tr>\n<td>&#8235;استبعاد من لا يملك وقتاً أو موارد&#8236;<\/td>\n<td>&#8235;شبكات صداقة ورأس مال اجتماعي&#8236;<\/td>\n<td>&#8235;تنمية المهارات والمواهب&#8236;<\/td>\n<td>&#8235;<b>الأنشطة الطلابية<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;تثبيت مسارات مبكرة وفق الخلفية الاجتماعية&#8236;<\/td>\n<td>&#8235;تشكيل توقعات الطالب عن ذاته ومكانته&#8236;<\/td>\n<td>&#8235;مساعدة الطالب على اختيار المسار&#8236;<\/td>\n<td>&#8235;<b>التوجيه المهني<\/b>&#8236;<\/td>\n<\/tr>\n<tr>\n<td>&#8235;فجوة رقمية، عزلة، مراقبة مفرطة&#8236;<\/td>\n<td>&#8235;إعادة تعريف سلطة المعلم والتفاعل&#8236;<\/td>\n<td>&#8235;تحسين الوصول والكفاءة&#8236;<\/td>\n<td>&#8235;<b>التحول الرقمي<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;وصم بعض الطلاب أو الإفراط في العقاب&#8236;<\/td>\n<td>&#8235;تعليم حدود السلطة والطاعة&#8236;<\/td>\n<td>&#8235;حماية النظام والوقت التعليمي&#8236;<\/td>\n<td>&#8235;<b>اللوائح والعقوبات<\/b>&#8236;<\/td>\n<\/tr>\n<\/table>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Merton, 1968؛ زيادة وآخرون، 2014)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">06<\/p>", "notes": "عرّف ميرتون الوظائف الظاهرة بأنها النتائج الموضوعية المقصودة والمعترف بها من المشاركين، والوظائف الكامنة بأنها النتائج غير المقصودة أو غير المعترف بها (Merton, 1968).\n\nنقرأ كل صف من اليمين: الممارسة، ثم وظيفتها الظاهرة، ثم الكامنة، ثم الاختلال المحتمل. الاختبارات الموحدة مثلاً: ظاهرها قياس التحصيل والمقارنة، وكامنها تشكيل ثقافة تنافسية وترتيب السمعة، واختلالها المحتمل تضييق المنهج وقلق الاختبار وتحيز الفرص. والتوجيه المهني: ظاهره مساعدة الطالب على اختيار مساره، وكامنه تشكيل توقعاته عن ذاته ومكانته، واختلاله تثبيت مسارات مبكرة وفق خلفيته الاجتماعية.\n\nتتجلى القيمة البحثية لهذا التمييز في أنه ينقل التقويم من سؤال \"هل تحقق الهدف المعلن؟\" إلى سؤالين إضافيين: \"ما الذي حدث أيضاً؟\" و\"من انتفع ومن تضرر؟\". وقد أظهرت دراسة عربية تطبيقية لميرتون أن المنهج الخفي وسيط فعال لنقل القيم، وأن عدم التكامل بينه وبين المنهج الرسمي قد ينتج قيماً مغايرة للمقصود، وكشفت غلبة قيم الطاعة والجماعة على قيم الحرية والمساواة والتغيير في العينة المدروسة (زيادة وآخرون، 2014).", "ntitle": "الظاهر والكامن", "dark": false}, {"id": "balance", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;التوازن والتكامل · التضامن الاجتماعي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الإطار المفاهيمي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;توازنٌ لا سكون، وتضامنٌ لا تشابه فقط&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:20px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:26px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(38px * var(--fs));font-weight:700;color:#142B27\">&#8235;التوازن&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;قدرة النسق على امتصاص التوتر وإعادة تنظيم علاقاته، لا السكون المطلق.&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#6E3F94;background:#EEE6F3;border-radius:10px;padding:14px 16px\">&#8235;إسكات الخلاف حفاظاً على مظهر الانسجام = «توازن زائف» يخفي اختلالاً متراكماً.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:26px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(38px * var(--fs));font-weight:700;color:#142B27\">&#8235;التكامل&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;درجة اتساق الأدوار والمعايير بين المؤسسات والأفراد.&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;flex-wrap:wrap;gap:8px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:8px;padding:6px 14px\">&#8235;التكيف&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:8px;padding:6px 14px\">&#8235;تحقيق الأهداف&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:8px;padding:6px 14px\">&#8235;التكامل&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#142B27;background:#E1EFE7;border-radius:8px;padding:6px 14px\">&#8235;صيانة الأنماط&#8236;<\/p>\n<\/div>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27\">&#8235;نجاح القائد: تنسيق التدريس والإرشاد والنشاط والأسرة حول تعلم ذي معنى.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #B98B3E;border-radius:12px;padding:26px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(38px * var(--fs));font-weight:700;color:#142B27\">&#8235;التضامن&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;<b>آلي:<\/b> بالتشابه والضمير الجمعي. <b>عضوي:<\/b> بالتخصص والاعتماد المتبادل.&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#142B27;background:#F1E8D2;border-radius:10px;padding:14px 16px\">&#8235;الإفراط في التجانس نمطية، وفي التمايز تجزؤ؛ والحل منهج مشترك ومسارات مرنة.&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(طرابلسي، 2021؛ Durkheim, 1947, Book I)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">07<\/p>", "notes": "التوازن في الوظيفية ليس سكوناً مطلقاً، بل قدرة النسق على امتصاص التوتر وإعادة تنظيم علاقاته. والتكامل الوظيفي هو درجة اتساق الأدوار والمعايير بين المؤسسات والأفراد. ومن منظور بارسونز يحتاج كل نسق إلى التكيف، وتحقيق الأهداف، والتكامل، وصيانة الأنماط القيمية؛ وقد طُبق هذا التصور على علاقة المدرسة بالنظام السياسي وعلى تحليل المتطلبات الوظيفية المتبادلة بينهما (طرابلسي، 2021).\n\nإدارياً، لا يقاس نجاح قائد المدرسة بانخفاض المشكلات أو انتظام الجداول فقط، بل بقدرته على تنسيق التدريس والإرشاد والنشاط والشراكة الأسرية والموارد البشرية حول تعلم ذي معنى. والتوازن الصحي يسمح بالتغذية الراجعة والنقد؛ أما إسكات الخلاف حفاظاً على مظهر الانسجام فـ\"توازن زائف\" يخفي اختلالاً متراكماً.\n\nوميّز دوركايم بين تضامن ميكانيكي يقوم على التشابه وقوة الضمير الجمعي، وتضامن عضوي يقوم على الاختلاف والتخصص والاعتماد المتبادل. وفي المجتمع الحديث لا يكفي أن تجعل المدرسة الطلاب متشابهين؛ بل تمنحهم قاعدة قيمية مشتركة، وتنمي تخصصاتهم وقدرتهم على التعاون عبر الاختلاف (Durkheim, 1947, Book I).\n\nوهنا التوتر الخلاق: التجانس ضروري للمواطنة والتواصل، والتمايز ضروري لتقسيم العمل والإبداع. الإفراط في الأول يصنع نمطية، والإفراط في الثاني يصنع تجزؤاً أو نخبوية. والسياسة الرشيدة توازن بين منهج مشترك يضمن الهوية والحقوق، ومسارات مرنة لا تحبس الطالب في موقع اجتماعي سابق التحديد.", "ntitle": "التوازن والتكامل والتضامن", "dark": false}, {"id": "concepts", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;قاموس الوظيفية المبسّط&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الإطار المفاهيمي&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(60px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;ستة مفاهيم: تشبيهٌ يقرّب، ومثالٌ من مدارسنا&#8236;<\/h2>\n<table style=\"font-size:calc(24px * var(--fs));color:#2F3D39;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6\">\n<tr style=\"background:#0F3A31\">\n<th style=\"width:44%;color:#F2ECDF;text-align:right\">&#8235;مثال مدرسي سعودي&#8236;<\/th>\n<th style=\"width:38%;color:#F2ECDF;text-align:right\">&#8235;التشبيه الذهني&#8236;<\/th>\n<th style=\"width:18%;color:#B98B3E;text-align:right\">&#8235;المفهوم&#8236;<\/th>\n<\/tr>\n<tr>\n<td>&#8235;غياب معلم الرياضيات يربك الجدول وحصص الانتظار والإرشاد معاً&#8236;<\/td>\n<td>&#8235;فريق كرة قدم: لكل لاعب مركز، وغياب واحد يربك الخطة&#8236;<\/td>\n<td>&#8235;<b>النسق الاجتماعي<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;خطة علاجية بعد نتائج «نافس» لإعادة المستوى&#8236;<\/td>\n<td>&#8235;منظّم حرارة المكيّف يعيدها إلى الدرجة المطلوبة&#8236;<\/td>\n<td>&#8235;<b>التوازن البنائي<\/b>&#8236;<\/td>\n<\/tr>\n<tr>\n<td>&#8235;اليوم الوطني يجمع طلاباً من خلفيات مختلفة على هوية واحدة&#8236;<\/td>\n<td>&#8235;خيوط السجادة: ألوان مختلفة في نسيج واحد&#8236;<\/td>\n<td>&#8235;<b>التضامن الاجتماعي<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;المعلم والموجّه الطلابي ورائد النشاط والأسرة حول طالب متعثر&#8236;<\/td>\n<td>&#8235;أوركسترا: لكل آلة لحنها، والمايسترو ينسّق&#8236;<\/td>\n<td>&#8235;<b>التكامل الوظيفي<\/b>&#8236;<\/td>\n<\/tr>\n<tr>\n<td>&#8235;لائحة السلوك والمواظبة، ورصد الحضور في نظام «نور»&#8236;<\/td>\n<td>&#8235;إشارات المرور: تقيّد الحركة لتحمي الجميع&#8236;<\/td>\n<td>&#8235;<b>الضبط الاجتماعي<\/b>&#8236;<\/td>\n<\/tr>\n<tr style=\"background:#F4EFE4\">\n<td>&#8235;النسبة الموزونة (الثانوية + القدرات + التحصيلي) للقبول الجامعي&#8236;<\/td>\n<td>&#8235;غربال يفصل الحبوب بحسب حجمها&#8236;<\/td>\n<td>&#8235;<b>الفرز وتخصيص الأدوار<\/b>&#8236;<\/td>\n<\/tr>\n<\/table>\n<p style=\"font-size:calc(24px * var(--fs));color:#6E3F94\">&#8235;سؤال يرافق كل مفهوم: التوازن لمصلحة من؟ والفرز بأي معيار؟ والضبط بأي عدل؟&#8236;<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(علي، 2013؛ شيحة، 2006؛ Parsons, 1959) · التشبيهات والأمثلة من إعداد الباحثتين&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">08<\/p>", "notes": "هذه الشريحة قاموسنا للعرض كله. لكل مفهوم تشبيه يقرّبه، ومثال من مدارسنا.\n\nالنسق الاجتماعي: شبكة أدوار مترابطة. تخيلن فريق كرة قدم؛ غياب لاعب واحد يربك الخطة كلها. وفي المدرسة: غياب معلم الرياضيات لا يمس صفه فقط، بل يربك الجدول وحصص الانتظار وحتى الإرشاد.\n\nالتوازن البنائي: ليس السكون، بل قدرة النسق على العودة إلى حالته المطلوبة، كمنظم حرارة المكيف. ومثاله: حين تأتي نتائج اختبارات \"نافس\" دون المستوى، تبني المدرسة خطة علاجية لتعيد التوازن.\n\nالتضامن الاجتماعي: الرابطة التي تشد الأفراد إلى الجماعة، كخيوط السجادة المختلفة الألوان في نسيج واحد. ومثاله اليوم الوطني الذي يجمع طلاباً من خلفيات متنوعة على هوية واحدة.\n\nالتكامل الوظيفي: اتساق الأدوار، كالأوركسترا: لكل آلة لحنها والمايسترو ينسّق. ومثاله اجتماع المعلم والموجه الطلابي ورائد النشاط والأسرة حول طالب متعثر.\n\nالضبط الاجتماعي: القواعد التي تنظم السلوك، كإشارات المرور: تقيد الحركة لكنها تحمي الجميع. ومثاله لائحة السلوك والمواظبة ورصد الحضور في نظام \"نور\".\n\nالفرز وتخصيص الأدوار: توزيع الأفراد على المواقع بحسب الإنجاز، كالغربال الذي يفصل الحبوب بحسب حجمها. ومثاله النسبة الموزونة للقبول الجامعي.\n\nوأختم بالسطر الأحمر في أسفل الشريحة، لأنه سؤال سيرافقنا: كل مفهوم وظيفي يخفي سؤالاً معيارياً مؤجلاً؛ التوازن لمصلحة من؟ والفرز بأي معيار؟ والضبط بأي عدل؟ وهذا ما سنفتحه في القراءة النقدية.\n\nملاحظة أمانة: التشبيهات والأمثلة السعودية من إعداد الباحثتين لتقريب المفاهيم، أما التعريفات فمستندة إلى المراجع في التذييل.\n\nجسر: \"والآن إلى المؤسس الأول: إميل دوركايم.\"", "ntitle": "قاموس مبسّط", "dark": false}, {"id": "durkheim", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;إميل دوركايم&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الرواد المؤسسون&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;إميل دوركايم: التربية تنشئةٌ منظَّمة&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:24px\">\n<div style=\"width:620px;display:flex;flex-direction:column;gap:14px;background:#0F3A31;border-radius:16px;padding:32px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;التعريف (ترجمة بتصرف)&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;«تأثير الأجيال الراشدة في الأجيال التي لم تنضج بعد للحياة الاجتماعية… إنها التنشئة المنظمة للجيل الناشئ»&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#B7CBC3\">&#8235;ظاهرة اجتماعية موضوعية: خارجية عن الفرد، وقسرية تلزمه.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:14px\">\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:20px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#142B27\">&#8235;تضامن آلي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;قاعدة قيمية مشتركة بالتشابه&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:20px\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#142B27\">&#8235;تضامن عضوي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs))\">&#8235;تمايز يخدم تقسيم العمل&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;علاج الأنوميا (ضعف المعايير): أخلاق مدرسية بثلاثة أركان&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;gap:12px\">\n<p style=\"flex:1;font-size:calc(26px * var(--fs));font-weight:700;color:#142B27;background:#E1EFE7;border-radius:12px;padding:16px 18px\">&#8235;الانضباط&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(26px * var(--fs));font-weight:700;color:#142B27;background:#E1EFE7;border-radius:12px;padding:16px 18px\">&#8235;الارتباط بالجماعة&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(26px * var(--fs));font-weight:700;color:#142B27;background:#E1EFE7;border-radius:12px;padding:16px 18px\">&#8235;الاستقلال العقلي&#8236;<\/p>\n<\/div>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:24px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;border-right:4px solid #B98B3E;padding:4px 20px 4px 0\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#8C6420\">&#8235;التشبيه الذهني&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;اللغة الأم: لم تخترعها، لكنك تجدها قبلك وتلتزم قواعدها. هكذا التربية عند دوركايم.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:6px;border-right:4px solid #17694F;padding:4px 20px 4px 0\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;مثال من مدارسنا&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;مادة الدراسات الاجتماعية والمواطنة تبني القاعدة المشتركة، والمسارات الثانوية تبني التمايز.&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Durkheim, 1956؛ Durkheim, 1947, Book I؛ Parsons, 1956؛ علي، 2013)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">09<\/p>", "notes": "عرّف دوركايم التربية بأنها التأثير الذي تمارسه الأجيال الراشدة في الأجيال التي لم تنضج بعد للحياة الاجتماعية، بقصد تنمية حالات جسمية وعقلية وأخلاقية يطلبها المجتمع؛ واختصرها بأنها \"التنشئة المنظمة للجيل الناشئ\" (Durkheim, 1956).\n\nماذا يعني أنها \"ظاهرة اجتماعية موضوعية قسرية\"؟ خذن التشبيه: اللغة الأم. لم يخترعها أحد منا، وجدناها قبلنا، ونلتزم قواعدها حتى لو لم نخترها. كذلك نظام التربية: يجده الفرد قائماً، ويُلزمه بأنماط لا يملك الفكاك منها كلياً. ولهذا يصبح موضوع التربية تكوين \"الكائن الاجتماعي\" في الفرد.\n\nوتؤدي التربية عنده وظيفتين متلازمتين: التجانس، أي القاعدة القيمية المشتركة — وهذا التضامن الآلي القائم على التشابه — والتمايز الذي يخدم تقسيم العمل — وهذا التضامن العضوي القائم على التخصص (Durkheim, 1947, Book I). ومثالنا: مادة الدراسات الاجتماعية والمواطنة تبني القاعدة المشتركة لكل الطلاب، بينما المسارات الثانوية تبني التمايز.\n\nأما الأنوميا فهي ضعف المعايير في مجتمع سريع التحول. وعلاجها عند دوركايم أخلاق مدرسية بثلاثة أركان: الانضباط، والارتباط بالجماعة، والاستقلال العقلي الذي يجعل الطاعة مفهومة لا عمياء. وقد أبرز بارسونز في تقديمه للكتاب أن سلطة القاعدة تتحول من إكراه خارجي إلى سلطة أخلاقية عبر استدخال المعايير (Parsons, 1956).\n\nالتطبيق: القيم لا تُبنى بحصة منفردة، بل بعدالة التقويم وطريقة معالجة الخطأ واتساق سلوك القائد مع خطابه.\n\nسؤال متوقع: \"ما الفرق بين الضبط والإخضاع؟\"\nالجواب: الضبط المشروع يبرر القاعدة ويطبقها بعدل ويسمح بمراجعتها؛ والإخضاع يختزل الأخلاق في الطاعة.\n\nجسر: \"دوركايم أسّس للتربية أخلاقياً، وبارسونز يدخل بنا إلى داخل الفصل.\"", "ntitle": "إميل دوركايم", "dark": false}, {"id": "parsons", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;تالكوت بارسونز&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الرواد المؤسسون&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;تالكوت بارسونز: الفصل جسرٌ من البيت إلى المجتمع&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:24px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(38px * var(--fs));font-weight:700;color:#142B27\">&#8235;الأسرة&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;معايير خصوصية · عاطفة · مكانة منسوبة&#8236;<\/p>\n<\/div>\n<svg class=\"draw\" viewBox=\"0 0 96 48\" style=\"width:72px;height:36px;flex:none;overflow:visible\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M90 24 H8\" fill=\"none\" stroke=\"#B98B3E\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"--dur:.9s;--o:.2s\"/><path pathLength=\"1\" d=\"M28 6 L6 24 L28 42\" fill=\"none\" stroke=\"#B98B3E\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"--dur:.6s;--o:.85s\"/><\/svg>\n<div style=\"flex:1.2;display:flex;flex-direction:column;gap:8px;background:#0F3A31;border-radius:12px;padding:24px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(38px * var(--fs));font-weight:700;color:#F2ECDF\">&#8235;الفصل المدرسي&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5;color:#D8CFBD\">&#8235;معايير عمومية · إنجاز · تقويم وشهادات&#8236;<\/p>\n<\/div>\n<svg class=\"draw\" viewBox=\"0 0 96 48\" style=\"width:72px;height:36px;flex:none;overflow:visible\" aria-hidden=\"true\"><path pathLength=\"1\" d=\"M90 24 H8\" fill=\"none\" stroke=\"#B98B3E\" stroke-width=\"5\" stroke-linecap=\"round\" style=\"--dur:.9s;--o:.2s\"/><path pathLength=\"1\" d=\"M28 6 L6 24 L28 42\" fill=\"none\" stroke=\"#B98B3E\" stroke-width=\"5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"--dur:.6s;--o:.85s\"/><\/svg>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-radius:12px;padding:24px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(38px * var(--fs));font-weight:700;color:#142B27\">&#8235;المجتمع&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;أدوار مهنية وتقسيم عمل&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:24px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;padding:4px 20px 4px 0;border-right:4px solid #17694F\">\n<p style=\"font-size:calc(28px * var(--fs));font-weight:700;color:#142B27\">&#8235;وظيفتان&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;<b>التنشئة:<\/b> غرس قيمة الإنجاز وتكافؤ الفرص. <b>التخصيص:<\/b> فرز الطلاب وتوزيعهم على مسارات وأدوار.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;padding:4px 20px 4px 0;border-right:4px solid #B98B3E\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#8C6420\">&#8235;التشبيه الذهني&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;في البيت تُحَبّ لأنك «ابن العائلة»؛ وفي الملعب تُقيَّم بأهدافك وفق قانون واحد للجميع.&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;padding:4px 20px 4px 0;border-right:4px solid #17694F\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;مثال من مدارسنا&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.5\">&#8235;طفل الصف الأول يُقاس بالمعايير نفسها مع زملائه، ثم تفرز النسبة الموزونة مساره الجامعي.&#8236;<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:24px;align-items:center;background:#EEE6F3;border-radius:12px;padding:18px 28px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:700;color:#6E3F94;white-space:nowrap\">&#8235;السؤال الحاسم&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(24px * var(--fs));color:#142B27\">&#8235;ليس «هل يوجد فرز؟» بل: ما معاييره؟ متى يحدث؟ وهل وُزّعت فرص الاستعداد قبل النتائج؟&#8236;<\/p>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Parsons, 1959؛ شيحة، 2006)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">10<\/p>", "notes": "نشر بارسونز دراسته \"الفصل المدرسي بوصفه نسقاً اجتماعياً\" في Harvard Educational Review عام 1959 (Parsons, 1959). وفكرتها أن الفصل نسق مصغر يؤدي وظيفتين: التنشئة، والتخصيص أو الفرز.\n\nاتبعن السهم: الطفل في الأسرة محبوب لأنه ابن العائلة؛ المعايير خصوصية، والعلاقة عاطفية، والمكانة منسوبة. ثم يدخل الفصل فيُقاس بمعايير عمومية واحدة للجميع، وتُكتسب المكانة بالإنجاز. فالمدرسة جسر إلى المجتمع وأدواره المهنية. والتشبيه: في البيت تُحَب لأنك ابن العائلة، وفي الملعب تُقيَّم بالأهداف التي تسجلها وفق قانون واحد.\n\nومثالنا: طفل الصف الأول الذي كان محور اهتمام البيت، يُقاس فجأة بالمعايير نفسها مع زملائه. ثم في نهاية الرحلة تفرز النسبة الموزونة — الثانوية والقدرات والتحصيلي — مساره الجامعي والمهني.\n\nويشترط بارسونز لنجاح هذا الجسر أن تتشارك الأسرة والمدرسة القيم الأساسية (Parsons, 1959). وتؤكد أدبيات الأصول العربية على هذا التطبيع الاجتماعي والمهني بوصفه وظيفة مركزية للمدرسة (شيحة، 2006).\n\nلكن السؤال الحاسم: التحليل يفترض أن قواعد المنافسة عادلة، وأن المدرسة تقيس الجهد لا رأس المال الثقافي. فالمسألة ليست وجود الفرز، بل معاييره وتوقيته، وهل وُزّعت فرص الاستعداد قبل توزيع النتائج.\n\nجسر إلى النشاط: \"والآن، دعونا نختبر بارسونز في موقف حقيقي.\"", "ntitle": "تالكوت بارسونز", "dark": false}, {"id": "act-parsons", "style": "background:#0F3A31;color:#F2ECDF;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:700;color:#0F3A31;background:#B98B3E;padding:8px 24px;border-radius:40px\">&#8235;نشاط تفاعلي ١ من ٤&#8236;<\/p>\n<svg class=\"draw\" viewBox=\"0 0 24 24\" style=\"color:#B98B3E;width:40px;height:40px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\" aria-hidden=\"true\"><circle pathLength=\"1\" cx=\"12\" cy=\"12\" r=\"10\"/><polyline pathLength=\"1\" points=\"12 6 12 12 16 14\" style=\"--o:.7s;--dur:.7s\"/><\/svg>\n<p style=\"font-size:calc(24px * var(--fs));color:#D8CFBD\">&#8235;٥ دقائق&#8236;<\/p>\n<\/div>\n<p style=\"font-size:calc(24px * var(--fs));color:#B7CBC3\">&#8235;الرواد المؤسسون&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#F2ECDF\">&#8235;مأزق بارسونز في الفرز&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:28px 36px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;السيناريو: أنتِ قائدة مدرسة ثانوية&#8236;<\/p>\n<p style=\"font-size:calc(30px * var(--fs));line-height:1.55;color:#F2ECDF\">&#8235;وليّ أمر معروف في الحي يطلب تسجيل ابنه في مسار لا يؤهله له معدّله، مستنداً إلى علاقته الطويلة بالمدرسة ودعمه لأنشطتها. ماذا تفعلين؟&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#F8F4EA;border-radius:12px;padding:22px 24px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#6E3F94\">&#8235;أ&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.45;color:#142B27\">&#8235;أستجيب حفاظاً على العلاقة مع المجتمع المحلي&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#F8F4EA;border-radius:12px;padding:22px 24px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#17694F\">&#8235;ب&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.45;color:#142B27\">&#8235;أرفض وأطبّق المعيار نفسه على الجميع&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:#F8F4EA;border-radius:12px;padding:22px 24px\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#8C6420\">&#8235;ج&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.45;color:#142B27\">&#8235;أطبّق المعيار، وأقدّم خطة دعم تتيح للطالب فرصة عادلة لاحقة&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"font-size:calc(26px * var(--fs));color:#D8CFBD\">&#8235;صوّتي برفع اليد، ثم نناقش: أيّ خيار يعيد المدرسة إلى منطق البيت؟ وأيّها يجمع العمومية والإنصاف؟&#8236;<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#B7CBC3\">&#8235;(Parsons, 1959؛ OECD, 2024) · السيناريو من إعداد الباحثتين&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#B7CBC3;text-align:left\">11<\/p>", "notes": "طريقة الإدارة:\n١. (دقيقة) قراءة السيناريو بصوت واضح، ثم 20 ثانية تفكير صامت.\n٢. (دقيقة) تصويت برفع الأيدي على (أ) ثم (ب) ثم (ج)، وذكر الأعداد تقريبياً.\n٣. (دقيقتان) جملة تبرير واحدة من مصوِّتة على كل خيار.\n٤. (دقيقة) التعقيب الأكاديمي.\n\nالتعقيب الأكاديمي:\nالخيار (أ) يعيد المدرسة إلى منطق الأسرة: معيار خصوصي قائم على العلاقة والمكانة المنسوبة، وهو ما يرى بارسونز أن المدرسة وُجدت لتجاوزه؛ فالمدرسة جسر من الخصوصية إلى العمومية.\nالخيار (ب) بارسونزي خالص: معيار عمومي يُطبَّق على الجميع، ويحمي شرعية الفرز.\nالخيار (ج) يمثل الوظيفية النقدية: يحافظ على العمومية، لكنه ينتبه إلى أن الإنجاز المقيس قد يعكس فرص استعداد غير متكافئة، فيضيف الإنصاف بدعم متناسب مع الحاجة (OECD, 2024).\nوشرط بارسونز نفسه أن نجاح الجسر يتطلب تشارك الأسرة والمدرسة القيم الأساسية (Parsons, 1959)؛ فالقائدة الحكيمة لا تكتفي بالرفض، بل تحاور ولي الأمر حتى يفهم منطق القاعدة.\n\nإن انقسمت الأصوات بين (ب) و(ج) فهذا مدخل طبيعي إلى ميرتون: القاعدة الواحدة قد تكون عادلة في ظاهرها، وظالمة في أثرها على بعض الطلاب.", "ntitle": "نشاط تفاعلي ١", "dark": true}, {"id": "merton", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#6E3F94\">&#8235;روبرت ميرتون&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الرواد المؤسسون&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;روبرت ميرتون: لكل دواء آثار جانبية&#8236;<\/h2>\n<p style=\"font-size:calc(26px * var(--fs));color:#142B27\">&#8235;<b><span style=\"color:#8C6420\">التشبيه الذهني:<\/span><\/b> كل ممارسة مدرسية تشبه الدواء — أربعة أسئلة تكشفها:&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:22px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الأثر المقصود للدواء&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;الوظيفة الظاهرة&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;مقصودة ومعترف بها من المشاركين&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">Manifest Function<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #B98B3E;border-radius:12px;padding:22px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;الأثر الجانبي&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;الوظيفة الكامنة&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;غير مقصودة أو غير معترف بها&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">Latent Function<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #6E3F94;border-radius:12px;padding:22px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;يضرّ مريضاً آخر&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;الاختلال الوظيفي&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;نافع لفئة، مختل لفئة أخرى&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">Dysfunction<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #142B27;border-radius:12px;padding:22px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;دواء آخر بالنتيجة نفسها&#8236;<\/p>\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;البديل الوظيفي&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;الشكل القائم ليس الوحيد الممكن&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">Functional Alternative<\/p>\n<\/div>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:10px;background:#0F3A31;border-radius:16px;padding:26px 32px\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#B98B3E\">&#8235;مثال من مدارسنا: منصة «مدرستي» في جائحة كورونا&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));line-height:1.5;color:#F2ECDF\">&#8235;<b>ظاهرها:<\/b> استمرار التعليم · <b>كامنها:<\/b> رفع المهارات الرقمية للأسر والمعلمين · <b>اختلالها المحتمل:<\/b> فجوة لدى الأسر الأضعف اتصالاً · <b>بديلها:<\/b> تعليم مدمج بدعم الوصول&#8236;<\/p>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(Merton, 1968؛ زيادة وآخرون، 2014)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">12<\/p>", "notes": "قدّم روبرت ميرتون تصحيحاً جوهرياً للوظيفية الكلية: بدلاً من افتراض أن كل مؤسسة قائمة نافعة وضرورية للمجتمع كله، اقترح تحليلاً \"متوسط المدى\" يميز بين الوظيفة والاختلال ويعترف بالبدائل (Merton, 1968).\n\nوأسهل طريق لفهمه: الدواء. لكل دواء أثر مقصود هو الشفاء — هذه الوظيفة الظاهرة، أي النتائج المقصودة والمعترف بها من المشاركين. وله آثار جانبية لم يقصدها أحد — هذه الوظيفة الكامنة، أي النتائج غير المقصودة أو غير المعترف بها (Merton, 1968). وقد ينفع مريضاً ويضر آخر — هذا الاختلال الوظيفي؛ فالظاهرة الواحدة قد تكون وظيفية لفئة ومختلة لأخرى، ولذلك يقتضي الحكم تحديد وحدة التحليل وميزان النتائج الصافية (Merton, 1968). وأخيراً قد يوجد دواء آخر يحقق النتيجة نفسها بأضرار أقل — هذا البديل الوظيفي.\n\nومثالنا القريب: منصة \"مدرستي\" في جائحة كورونا. ظاهرها استمرار التعليم. وكامنها — وهذا ما لم يكن هدفاً معلناً — رفع المهارات الرقمية لدى الأسر والمعلمين. واختلالها المحتمل فجوة لدى الأسر الأضعف اتصالاً أو الأقل أجهزة. وبديلها الوظيفي اليوم تعليم مدمج مع دعم الوصول.\n\nوهذا ليس تنظيراً فقط؛ فقد أظهرت دراسة عربية تطبيقية لمفهومي ميرتون أن المنهج الخفي وسيط فعال لنقل القيم، وكشفت غلبة قيم الطاعة والجماعة على قيم الحرية والمساواة والتغيير في العينة المدروسة (زيادة وآخرون، 2014).\n\nملاحظة أمانة: تحليل مثال \"مدرستي\" تطبيق من الباحثتين لمفاهيم ميرتون، لا نتيجة دراسة منشورة.\n\nسؤال متوقع: \"أليس ميرتون وظيفياً؟ فلماذا في المسار النقدي؟\"\nالجواب: هو نقد من الداخل؛ لا يرفض النسق لكنه يرفض تقديسه، ويمهّد لنقد نظريات الصراع.\n\nومن ميرتون أيضاً أربع طبقات لنتائج المؤسسة التعليمية: مقصودة نافعة كاكتساب المعرفة الأساسية، وغير مقصودة نافعة كبناء الصداقات وشبكات الدعم، ومقصودة ضارة كالإقصاء المتعمد تحت مسمى الانتقائية، وغير مقصودة ضارة كتحول مؤشر الأداء إلى هدف يضيّق التعلم. ومفهوم البدائل يمنح القيادة مساحة للابتكار: إذا كانت غاية الاجتماع الصباحي بناء الانتماء، فصورته التقليدية ليست مقدسة.\n\nجسر: \"والآن جاء دوركن لتكنّ محققات ميرتونيات.\"", "ntitle": "روبرت ميرتون", "dark": false}, {"id": "act-merton", "style": "background:#0F3A31;color:#F2ECDF;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:700;color:#0F3A31;background:#B98B3E;padding:8px 24px;border-radius:40px\">&#8235;نشاط تفاعلي ٢ من ٤&#8236;<\/p>\n<svg class=\"draw\" viewBox=\"0 0 24 24\" style=\"color:#B98B3E;width:40px;height:40px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round\" aria-hidden=\"true\"><circle pathLength=\"1\" cx=\"12\" cy=\"12\" r=\"10\"/><polyline pathLength=\"1\" points=\"12 6 12 12 16 14\" style=\"--o:.7s;--dur:.7s\"/><\/svg>\n<p style=\"font-size:calc(24px * var(--fs));color:#D8CFBD\">&#8235;٦ دقائق&#8236;<\/p>\n<\/div>\n<p style=\"font-size:calc(24px * var(--fs));color:#B7CBC3\">&#8235;الرواد المؤسسون&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#F2ECDF\">&#8235;المحقق الميرتوني: مظاهر وكوامن&#8236;<\/h2>\n<p style=\"font-size:calc(28px * var(--fs));color:#D8CFBD\">&#8235;كل مجموعة تختار ممارسة واحدة، وتستخرج في ثلاث دقائق:&#8236;<\/p>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<p style=\"flex:1;font-size:calc(28px * var(--fs));font-weight:700;color:#142B27;background:#E1EFE7;border-radius:12px;padding:18px 24px\">&#8235;١ · الوظيفة الظاهرة&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(28px * var(--fs));font-weight:700;color:#142B27;background:#F1E8D2;border-radius:12px;padding:18px 24px\">&#8235;٢ · الوظيفة الكامنة&#8236;<\/p>\n<p style=\"flex:1;font-size:calc(28px * var(--fs));font-weight:700;color:#142B27;background:#EEE6F3;border-radius:12px;padding:18px 24px\">&#8235;٣ · الاختلال المحتمل&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:row-reverse;gap:16px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,0.18);border-radius:16px;padding:26px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#B98B3E\">&#8235;المجموعة الأولى&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#F2ECDF\">&#8235;الزي المدرسي الموحد&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,0.18);border-radius:16px;padding:26px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#B98B3E\">&#8235;المجموعة الثانية&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#F2ECDF\">&#8235;طابور الصباح&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;border:1px solid rgba(255,255,255,0.18);border-radius:16px;padding:26px\">\n<p style=\"font-size:calc(24px * var(--fs));color:#B98B3E\">&#8235;المجموعة الثالثة&#8236;<\/p>\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(40px * var(--fs));font-weight:700;color:#F2ECDF\">&#8235;مجموعات الواتساب المدرسية&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"font-size:calc(26px * var(--fs));color:#D8CFBD\">&#8235;سؤال الختام: هل هناك «بديل وظيفي» يحقق الوظيفة الظاهرة بأقل اختلال؟&#8236;<\/p>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#B7CBC3\">&#8235;(Merton, 1968) · النشاط من إعداد الباحثتين&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#B7CBC3;text-align:left\">13<\/p>", "notes": "طريقة الإدارة:\n١. (30 ثانية) تقسيم الحاضرات إلى ثلاث مجموعات بحسب المقاعد، وإسناد ممارسة لكل مجموعة.\n٢. (3 دقائق) كل مجموعة تستخرج: الظاهرة، والكامنة، والاختلال المحتمل، وبديلاً وظيفياً إن أمكن، وتختار متحدثة.\n٣. (دقيقة ونصف) عرض 30 ثانية لكل مجموعة.\n٤. (دقيقة) التعقيب الأكاديمي.\n\nإجابات متوقعة لتوجيه النقاش:\n- الزي الموحد: ظاهره الانضباط وتقليل الفروق الظاهرة؛ كامنه بناء الهوية والانتماء؛ اختلاله امتثال شكلي أو عبء على الأسر محدودة الدخل؛ بديله دعم مادي ومرونة منضبطة.\n- طابور الصباح: ظاهره الانضباط والانتماء الوطني؛ كامنه تعليم الامتثال للسلطة والتراتب، وصناعة رمزية جماعية؛ اختلاله الملل والحضور الشكلي وهدر وقت التعلم؛ بديله لقاءات صباحية قصيرة تشاركية يقدمها الطلاب.\n- مجموعات الواتساب: ظاهرها التواصل السريع مع الأسر؛ كامنها نقل جزء من وظيفة المدرسة إلى البيت ومراقبة متبادلة بين الأسر؛ اختلالها ضغط على الأسر غير المتفرغة أو الأقل إلماماً بالتقنية، والمقارنة بين الأطفال، والتواصل خارج أوقات العمل؛ بديلها قناة رسمية محددة الأوقات عبر المنصات المعتمدة.\n\nالتعقيب الأكاديمي:\nالكامن لم يكن في ذهن من صمم الممارسة؛ ولهذا قال ميرتون إن الوظائف الكامنة هي النتائج غير المقصودة وغير المعترف بها (Merton, 1968). والاختلال قد يقع على فئة دون أخرى (Merton, 1968). وهذا يعطي القائد أداة تشخيص عملية: كل ممارسة تُسأل ثلاثة أسئلة قبل أن تُعمَّم أو تُلغى.\n\nملاحظة: الإجابات المتوقعة اجتهاد تحليلي، وتُقبل بدائل منطقية من الحاضرات.", "ntitle": "نشاط تفاعلي ٢", "dark": true}, {"id": "school", "style": "background:#F8F4EA;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:24px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#17694F\">&#8235;وظائف المدرسة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;المدرسة وظيفياً&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(60px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;خمس وظائف كبرى… ولكلٍّ سؤال ميزان&#8236;<\/h2>\n<div style=\"display:flex;flex-direction:row-reverse;gap:14px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:8px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:20px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(32px * var(--fs));font-weight:700;color:#142B27\">&#8235;التنشئة&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.4\">&#8235;تنشئة ثانوية عبر المنهج الرسمي والخفي&#8236;<\/p
