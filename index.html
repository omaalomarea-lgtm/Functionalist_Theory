 "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#142B27\">&#8235;لصانع السياسة · لإدارة التعليم · لقائد المدرسة · للبحث العلمي&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));color:#56615D\">&#8235;التوصيات&#8236;<\/p>\n<\/div>\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(64px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;توصيات استراتيجية وتنفيذية&#8236;<\/h2>\n<div style=\"flex:1;display:flex;flex-direction:row-reverse;gap:16px\">\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #0F3A31;border-radius:12px;padding:24px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;صانع السياسة&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• تقييم أثر اجتماعي لكل سياسة: الظاهر والكامن والفئات المتأثرة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• مؤشرات إنصاف موزعة لا متوسطات&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• مسارات مرنة وتأخير الفرز عالي المخاطر&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• مهارات واسعة قابلة للنقل، وتمويل شامل مع دعم موجّه&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #0F3A31;border-radius:12px;padding:24px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;إدارة التعليم&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• لوحات قيادة للتعلم والانتماء والعدالة لا للانضباط الشكلي وحده&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• إشراف ينقل المعرفة بين المدارس&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• مراجعة إجراءات العادة وتطوير القادة في تحليل النظم والشورى&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #17694F;border-radius:12px;padding:24px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;قائد المدرسة&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• «تدقيق وظيفي» فصلي لكل اجتماع ونشاط ولائحة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• تحليل العقوبات والغياب بحسب الفئات بلا وصم&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• ميثاق قيمي تشاركي، والاعتراض مصدر معلومات لا تهديد&#8236;<\/p>\n<\/div>\n<div style=\"flex:1;display:flex;flex-direction:column;gap:12px;background:rgba(255,253,248,0.74);border:1px solid #E2D9C6;border-top:6px solid #6E3F94;border-radius:12px;padding:24px\">\n<h3 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(34px * var(--fs));font-weight:700;color:#142B27\">&#8235;البحث العلمي&#8236;<\/h3>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• دراسات ميدانية في مدارس الجوف عن الوظائف الكامنة&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• دراسة طولية لأثر المسارات في الحراك&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;• أداة عربية لقياس التوازن بين التكامل والإنصاف والصوت الطلابي&#8236;<\/p>\n<\/div>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;(توصيات العرض، المبنية على: OECD, 2024؛ UNESCO, 2020؛ Saudi Vision 2030, 2021)&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">28<\/p>", "notes": "لصانع السياسة: اعتماد تقييم أثر اجتماعي لكل سياسة تعليمية يتضمن الوظائف الظاهرة والكامنة والاختلالات والفئات المتأثرة؛ ونشر مؤشرات الإنصاف موزعة لا متوسطات فقط؛ وجعل المسارات التعليمية والمهنية مرنة وقابلة للانتقال وتأخير الفرز عالي المخاطر قدر الإمكان؛ ومواءمة التعليم مع سوق العمل بمهارات واسعة قابلة للنقل؛ ودمج القيم الوطنية والإسلامية في خبرة المدرسة الكلية؛ والجمع بين التمويل الشامل والدعم الموجه للفئات والمناطق الأبعد عن الفرص؛ وإنشاء آليات مشاركة مؤسسية للطلاب والأسر والمعلمين.\n\nلإدارة التعليم: بناء لوحات قيادة تجمع مؤشرات التعلم والانتماء والعدالة والسلامة والانتقال؛ وتمكين الإشراف التربوي من نقل المعرفة بين المدارس وتحويل الملاحظات الميدانية إلى تعلم سياساتي؛ ومراجعة الإجراءات التي تستمر بحكم العادة والبحث عن بدائل أقل كلفة وأكثر عدلاً؛ وتطوير قادة المدارس في تحليل النظم والبيانات وأخلاقيات القرار والشورى وإدارة التغيير.\n\nلقائد المدرسة: \"تدقيق وظيفي\" فصلي: ما وظيفة كل اجتماع ونشاط ولائحة؟ وما أثره غير المقصود؟ وتحليل العقوبات والغياب والمشاركة والتحصيل بحسب الفئات ومعالجة الفجوات بلا وصم؛ وبناء ميثاق قيمي تشاركي؛ وتوسيع الشراكة مع الأسرة والمجتمع وسوق العمل مع حماية الغاية التربوية؛ واعتبار الاعتراض والتغذية الراجعة مصادر معلومات للنسق.\n\nللبحث العلمي: دراسات ميدانية في مدارس منطقة الجوف حول الوظائف الكامنة للانضباط والتقويم والمنصات الرقمية؛ واختبار العلاقة بين القيادة التكاملية والعدالة التنظيمية والانتماء والتحصيل؛ ودراسة أثر المسارات المهنية في الحراك طولياً؛ وتطوير أداة عربية لقياس التوازن بين التكامل المؤسسي والإنصاف والصوت الطلابي.", "ntitle": "التوصيات", "dark": false}, {"id": "closing", "style": "background:#FCFAF4;color:#142B27;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:96px 128px 112px;display:flex;flex-direction:column;gap:28px;position:absolute", "html": "<div style=\"position:absolute;left:0;top:0;width:24px;height:1080px;background:#7B4FA0\"><\/div>\n<div style=\"display s New Roman', serif;font-size:calc(52px * var(--fs));font-weight:700;line-height:1.45;color:#142B27\">&#8235;قائد المدرسة حارسٌ للتوازن، <span style=\"color:#7B4FA0\">لكنه أيضاً أمينٌ على العدل<\/span>؛ والتربية إعدادٌ للأدوار من غير أن تختزل الإنسان في دوره.&#8236;<\/p>\n<div style=\"flex:1\"><\/div>\n<div style=\"height:3px;background:#E6DFEE\"><\/div>\n<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center\">\n<p style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(44px * var(--fs));font-weight:700;color:#142B27\">&#8235;شكراً لحسن الاستماع&#8236;<\/p>\n<p style=\"font-size:calc(26px * var(--fs));color:#56615D\">&#8235;ونرحب بأسئلتكم وملاحظاتكم&#8236;<\/p>\n<\/div>", "notes": "تقدم النظرية الوظيفية عدسة قوية لفهم المدرسة داخل شبكة المجتمع؛ فهي تكشف أن الحصة واللائحة والاختبار والقيادة ليست إجراءات فنية منفصلة، بل آليات لإنتاج القيم والأدوار والتضامن والفرص. إلا أن قوتها التفسيرية تتحول إلى خطر حين تتخذ استقرار النسق دليلاً على عدالته، أو تساوي بين الاختلاف والاختلال، أو تفترض أن الفرز يعكس الجدارة تلقائياً.\n\nلذلك لا تتمثل الغاية في استبدال الوظيفية بنظرية أحادية أخرى، بل في إعادة بنائها: ميرتونية في وعيها بالنتائج الكامنة والاختلالات والبدائل، نقدية في فحص القوة واللامساواة، وإسلامية في مرجعيتها الأخلاقية. وعندئذ يصبح قائد المدرسة حارساً للتوازن، لكنه أيضاً أمين على العدل؛ وتصبح السياسة أداة للتكامل، لكنها قابلة للمساءلة والإصلاح؛ وتصبح التربية إعداداً للأدوار، من غير أن تختزل الإنسان في دوره.\n\nشكراً للدكتورة نعيمة الدرعان، ولكنّ جميعاً على حسن الاستماع، ونرحب بأسئلتكم وملاحظاتكم.", "ntitle": "الخاتمة", "dark": false}, {"id": "refs-ar", "style": "background:#F3EEE2;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:20px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:baseline\">\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(56px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;المراجع العربية (APA 7)&#8236;<\/h2>\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#56615D\">&#8235;قائمة المراجع · ١ من ٢&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;border-top:2px solid #B98B3E;padding:12px 0 0 0\">\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;آل مسلط، محمد أحمد علي. (2019). القيادة الخادمة لدى قادة وقائدات المدارس الثانوية بمدينة أبها وعلاقتها بالالتزام التنظيمي للعاملين فيها. <i>مجلة جامعة الجوف للعلوم التربوية، 5<\/i>(2)، 51–75.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;البكر، فوزية بكر. (2017). <i>مدرستي صندوق مغلق<\/i>. مكتبة الرشد.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;الجمال، رانيا عبد المعز. (2016). <i>الأصول الفلسفية للتربية<\/i>. دار الكتاب الجامعي.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;جعنيني، نعيم حبيب. (2010). <i>الفلسفة وتطبيقاتها التربوية<\/i>. دار وائل.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;زيادة، منى حسني أحمد، ومحمد، أحمد أنور، والشعبيني، محمد مصطفى. (2014). روبرت ميرتون وإعادة صياغة النظرية الوظيفية مع دراسة تطبيقية لمفهومي الوظائف الظاهرة والكامنة. <i>مجلة القراءة والمعرفة<\/i>، (152)، 65–88.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;السهلاوي، عبدالله بن عبدالعزيز. (1993). وظيفة التربية في المجتمعات الرأسمالية بين نظريتين. <i>مجلة العلوم التربوية والدراسات الإسلامية، 5<\/i>(1).&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;شيحة، عبد المجيد عبد التواب. (2006). <i>في الأصول الفلسفية والاجتماعية للتربية<\/i>. دار الثقافة.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;طرابلسي، عبدالحق. (2021). المدرسة والنظام السياسي بين الخصائص البنيوية والمكونات الوظيفية: دراسة تحليلية من منظور سوسيولوجيا البنائية الوظيفية لتالكوت بارسونز. <i>مجلة المواقف، 17<\/i>(1)، 183–194.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;علي، سعيد إسماعيل. (2013). <i>الأصول الاجتماعية للتربية<\/i>. دار السلام.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;علي، سعيد إسماعيل. (2014). <i>الأصول الثقافية للتربية<\/i>. دار السلام.&#8236;<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45\">&#8235;علي، سعيد إسماعيل، وفرج، هاني عبد الستار. (2009). <i>فلسفة التربية: رؤية تحليلية ومنظور إسلامي<\/i>. المعهد العالمي للفكر الإسلامي ودار الفكر العربي. [ورد في توصيف المقرر: 2008، «فرح»]&#8236;<\/p>\n<\/div>\n<p style=\"position:absolute;right:128px;bottom:64px;width:1480px;font-size:calc(24px * var(--fs));color:#56615D\">&#8235;كتب التوصيف: الجمال 2016 · علي 2013 · جعنيني 2010 · شيحة 2006 · البكر 2017 · علي وفرج 2009 · علي 2014&#8236;<\/p>\n<p style=\"position:absolute;left:128px;bottom:64px;width:80px;font-size:calc(24px * var(--fs));color:#56615D;text-align:left\">30<\/p>", "notes": "", "ntitle": "", "dark": false}, {"id": "refs-en", "style": "background:#F3EEE2;color:#2F3D39;font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif;text-align:right;padding:112px 128px 160px;display:flex;flex-direction:column;gap:20px;position:absolute", "html": "<div style=\"display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:baseline\">\n<h2 style=\"font-family:'Amiri', 'Times New Roman', serif;font-size:calc(56px * var(--fs));font-weight:700;line-height:1.3;color:#142B27\">&#8235;المراجع الأجنبية والمؤسسية (APA 7)&#8236;<\/h2>\n<p style=\"font-size:calc(24px * var(--fs));font-weight:600;color:#56615D\">&#8235;قائمة المراجع · ٢ من ٢&#8236;<\/p>\n<\/div>\n<div style=\"display:flex;flex-direction:column;gap:6px;border-top:2px solid #B98B3E;padding:12px 0 0 0\">\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Bourdieu, P., &amp; Passeron, J.-C. (1977). <i>Reproduction in education, society and culture<\/i>. Sage.<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Bowles, S., &amp; Gintis, H. (1976). <i>Schooling in capitalist America: Educational reform and the contradictions of economic life<\/i>. Basic Books.<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Durkheim, E. (1947). <i>The division of labor in society<\/i> (G. Simpson, Trans.). Free Press. (Original work published 1893)<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Durkheim, E. (1956). <i>Education and sociology<\/i> (S. D. Fox, Trans.). Free Press.<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Freire, P. (2000). <i>Pedagogy of the oppressed<\/i> (30th anniversary ed.; M. B. Ramos, Trans.). Continuum. (Original work published 1970)<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Merton, R. K. (1968). <i>Social theory and social structure<\/i> (Enlarged ed.). Free Press.<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Organisation for Economic Co-operation and Development. (2024). <i>Education equity<\/i>. OECD. https://www.oecd.org/en/topics/education-equity.html<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Parsons, T. (1959). The school class as a social system: Some of its functions in American society. <i>Harvard Educational Review, 29<\/i>(4), 297–318.<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">Saudi Vision 2030. (2021). <i>Human Capability Development Program<\/i>. https://www.vision2030.gov.sa/en/explore/programs/human-capability-development-program<\/p>\n<p style=\"font-size:calc(24px * var(--fs));line-height:1.45;text-align:left\">UNESCO. (2020). <i>Global education monitoring report 2020: Inclusion and education—All means all<\/i>.       if(t==='ASIDE'||c.classList.contains('connector')) return;
      if(isAbs(c)){
        if(t==='DIV' && !c.textContent.trim()){ c.classList.add('bar-y'); return; }
        foot.push(c); c.classList.add('ft'); return;
      }
      if(t==='TABLE'){ Array.prototype.forEach.call(c.querySelectorAll('tr'),function(r){body.push(r);}); return; }
      if(t==='H1'||t==='H2'){ heads.push(c); c.classList.add('hd'); return; }
      if(t==='DIV' && !c.textContent.trim() && !c.querySelector('img,svg')){
        var st=c.getAttribute('style')||'';
        if(/height\s*:\s*\d+px/.test(st) && /background/.test(st)){ c.classList.add('rule-x'); c.style.setProperty('--d','.35s'); }
        return;
      }
      if(t==='DIV' && !isCard(c)){ walk(c); return; }
      body.push(c);
      if((t==='DIV'||t==='P') && /background\s*:|border\s*:|border-right|border-top/.test(c.getAttribute('style')||'')){
        c.classList.add('card');
        var cs=c.getAttribute('style')||''; if(/rgba\(255,\s*253,\s*248/.test(cs)) c.classList.add('glass'); else if(/background\s*:\s*rgba\(255,\s*255,\s*255,\s*0\.[01]/.test(cs)) c.classList.add('glass-dark');
      }
    });
  }
  walk(sec);
  var step=0.075, base=0.12, i=0;
  heads.forEach(function(el){ el.classList.add('u'); el.style.setProperty('--d',(base+i*0.1).toFixed(3)+'s'); i++; });
  var start=base+(heads.length?0.28:0);
  body.forEach(function(el,k){
    el.classList.add('u');
    var kk=Math.min(k,18);
    el.style.setProperty('--d',(start+kk*step+(k>18?(k-18)*0.02:0)).toFixed(3)+'s');
  });
  var end=start+Math.min(body.length,18)*step+0.15;
  foot.forEach(function(el,k){ el.classList.add('u'); el.style.setProperty('--d',(end+k*0.08).toFixed(3)+'s'); });

  /* gold hand-drawn rule beneath each heading */
  heads.forEach(function(h){
    if(h.querySelector('.h-rule')) return;
    h.style.position='relative';
    var tmp=document.createElement('div'); tmp.innerHTML=HRULE;
    var r=tmp.firstChild; r.style.setProperty('--d',(parseFloat(h.style.getPropertyValue('--d'))+0.35)+'s');
    h.appendChild(r);
  });
  /* corner ornament */
  if(s.id!=='cover' && s.id!=='closing'){
    var tmp2=document.createElement('div'); tmp2.innerHTML=CORNER;
    var c=tmp2.firstChild; c.style.setProperty('--d','.2s'); sec.appendChild(c);
  }
  /* arrows and icons inherit their unit delay */
  Array.prototype.forEach.call(sec.querySelectorAll('svg.draw'),function(g){
    if(g.classList.contains('h-rule')||g.classList.contains('corner')) return;
    var host=g.closest('.u'); if(host && !g.style.getPropertyValue('--d')) g.style.setProperty('--d',host.style.getPropertyValue('--d'));
  });
}

/* ================= Slide-specific drawn graphics ================= */
var HOOKS={
  roots:function(sec){
    var col=[].find.call(sec.querySelectorAll('div'),function(d){return d.style.width==='520px';}); if(!col) return;
    col.style.position='relative';
    var rows=[].filter.call(col.children,function(c){return c.classList.contains('card');});
    if(rows.length<2) return;
    var ys=rows.map(function(r){return r.offsetTop+r.offsetHeight/2;});
    var top=ys[0], h=ys[ys.length-1]-top;
    var dots=ys.map(function(y,k){return '<circle class="fill" cx="7" cy="'+(y-top+4)+'" r="4.5" fill="#FBF7EE" stroke="#B98B3E" stroke-width="2" style="transition-delay:calc(var(--d) + '+(0.35+k*0.28)+'s)"/>';}).join('');
    var g=svg('<path pathLength="1" d="M7 4 V '+(h+4)+'" fill="none" stroke="#B98B3E" stroke-width="2" stroke-linecap="round" style="--dur:1.6s"/>'+dots,
      'connector draw','right:-26px;top:'+(top-4)+'px;width:14px;height:'+(h+8)+'px');
    g.setAttribute('viewBox','0 0 14 '+(h+8));
    g.style.setProperty('--d','.45s'); col.appendChild(g);
  },
  model:function(sec){
    var row=sec.querySelector('h2 + div'); if(!row) return;
    row.style.position='relative';
    var W=row.offsetWidth;
    var g=svg('<path pathLength="1" d="M'+(W-4)+' 10 H 6" fill="none" stroke="#B98B3E" stroke-width="2" stroke-linecap="round" style="--dur:2.2s"/>'+
      '<path pathLength="1" d="M20 2 L5 10 L20 18" fill="none" stroke="#B98B3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="--o:2s;--dur:.5s"/>'+
      '<circle class="fill" cx="'+(W-4)+'" cy="10" r="4" fill="#B98B3E"/>',
      'connector draw','left:0;bottom:-30px;width:'+W+'px;height:20px');
    g.setAttribute('viewBox','0 0 '+W+' 20');
    g.style.setProperty('--d','.9s'); row.appendChild(g);
  }
};
function runHooks(){
  slides.forEach(function(sec,i){
    var id=DECK[i].id; if(!HOOKS[id]) return;
    [].forEach.call(sec.querySelectorAll('svg.connector'),function(x){x.remove();});
    HOOKS[id](sec);
  });
}

buildAll();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(runHooks);}else{runHooks();}

/* ================= Ticks (sections) ================= */
var ticks=document.getElementById('ticks');
SECTIONS.forEach(function(sct){
  var b=document.createElement('button'); b.title=sct.name; b.setAttribute('aria-label',sct.name);
  b.addEventListener('click',function(){go(sct.start);}); ticks.appendChild(b); sct.el=b;
});

/* ================= Navigation ================= */
var cur=-1;
var bar=document.querySelector('#progress i');
var countEl=document.getElementById('count'), sectEl=document.getElementById('sect');
var nb=document.getElementById('notesBtn');
var notes=document.getElementById('notes'), notesBody=document.getElementById('notesBody');

function sectionOf(i){ var r=SECTIONS[0]; SECTIONS.forEach(function(s){ if(i>=s.start) r=s; }); return r; }
function pad(n){ return (n<10?'0':'')+n; }

function go(i){
  i=Math.max(0,Math.min(slides.length-1,i));
  if(i===cur) return;
  var prev=slides[cur];
  if(prev){ prev.classList.remove('in'); prev.classList.remove('active'); }
  var s=slides[i];
  s.classList.remove('in');
  s.classList.add('active');
  void s.offsetWidth;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ s.classList.add('in'); }); });
  cur=i;
  bar.style.transform='scaleX('+((i+1)/slides.length)+')';
  countEl.innerHTML='<b>'+pad(i+1)+'</b> / '+slides.length;
  var sc=sectionOf(i); sectEl.textContent=sc.name;
  SECTIONS.forEach(function(x){ x.el.classList.toggle('on', i>=x.start); });
  document.getElementById('notesTitle').textContent=DECK[i].ntitle||'';
  notesBody.textContent=DECK[i].notes||'';
  var hasN=!!(DECK[i].ntitle||DECK[i].notes); nb.disabled=!hasN; notes.style.display=hasN?'':'none';
  try{ history.replaceState(null,'','#'+(i+1)); }catch(e){}
}
function next(){ go(cur+1); } function prev(){ go(cur-1); }

/* ================= Fit stage ================= */
function fit(){
  var k=Math.min(window.innerWidth/1920, window.innerHeight/1080);
  stage.style.transform='translate('+(-960*k)+'px,'+(-540*k)+'px) scale('+k+')';
}
window.addEventListener('resize',fit); fit();

/* ================= Font size ================= */
var FS=[0.9,0.95,1,1.05,1.1,1.15,1.2], fi=2;
try{ var saved=parseInt(localStorage.getItem('fx-fs'),10); if(saved>=0&&saved<FS.length) fi=saved; }catch(e){}
function setFs(n){
  fi=Math.max(0,Math.min(FS.length-1,n));
  document.documentElement.style.setProperty('--fs',FS[fi]);
  document.getElementById('fsv').textContent=Math.round(FS[fi]*100)+'%';
  try{ localStorage.setItem('fx-fs',fi); }catch(e){}
  if(slides.length) requestAnimationFrame(runHooks);
}
setFs(fi);

/* ================= Notes & fullscreen ================= */
function toggleNotes(){
  if(nb.disabled) return;
  var open=!notes.classList.contains('open');
  notes.classList.toggle('open',open); notes.setAttribute('aria-hidden',!open); nb.setAttribute('aria-pressed',open);
}
function toggleFs(){
  var d=document;
  if(!d.fullscreenElement && !d.webkitFullscreenElement){
    var el=d.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
  } else { (d.exitFullscreen||d.webkitExitFullscreen).call(d); }
}

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('fplus').onclick=function(){setFs(fi+1);};
document.getElementById('fminus').onclick=function(){setFs(fi-1);};
nb.onclick=toggleNotes;
document.getElementById('fsBtn').onclick=toggleFs;

document.addEventListener('keydown',function(e){
  if(e.altKey||e.ctrlKey||e.metaKey) return;
  var k=e.key;
  if(k==='ArrowLeft'||k==='PageDown'||k===' '||k==='Enter'||k==='ArrowDown'){ e.preventDefault(); next(); }
  else if(k==='ArrowRight'||k==='PageUp'||k==='Backspace'||k==='ArrowUp'){ e.preventDefault(); prev(); }
  else if(k==='Home'){ go(0); } else if(k==='End'){ go(slides.length-1); }
  else if(k==='f'||k==='F'){ toggleFs(); }
  else if(k==='n'||k==='N'){ toggleNotes(); }
  else if(k==='+'||k==='='){ setFs(fi+1); } else if(k==='-'||k==='_'){ setFs(fi-1); }
});

/* touch swipe (RTL: swipe right = next) */
var tx=null;
stage.addEventListener('touchstart',function(e){ tx=e.touches[0].clientX; },{passive:true});
stage.addEventListener('touchend',function(e){
  if(tx===null) return; var dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)>50){ dx>0?next():prev(); }
},{passive:true});

/* idle chrome */
var idleT;
function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT=setTimeout(function(){ if(!notes.classList.contains('open')) document.body.classList.add('idle'); },2600); }
['mousemove','keydown','touchstart'].forEach(function(ev){ document.addEventListener(ev,wake,{passive:true}); }); wake();

window.addEventListener('hashchange',function(){var n=parseInt(location.hash.slice(1),10); if(!isNaN(n)&&n-1!==cur) go(n-1);});
/* start */
var h=parseInt((location.hash||'').replace('#',''),10);
go(isNaN(h)?0:h-1);
})();
</script>
</body>
</html>
